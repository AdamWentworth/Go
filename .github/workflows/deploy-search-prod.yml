name: deploy-search-prod

on:
  workflow_dispatch:
    inputs:
      image_ref:
        description: "Image to deploy: full ref, or just tag (latest / sha-<commit>). Empty defaults to latest."
        required: false
        default: "latest"
        type: string
      deploy_root:
        description: "Absolute path to the prod deploy state root"
        required: false
        default: "/home/adam/deploy/Go"
        type: string
      service_name:
        description: "Compose service to deploy"
        required: false
        default: "search_service"
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Search To Prod
    uses: ./.github/workflows/deploy-compose-health-prod.yml
    with:
      image_ref: ${{ inputs.image_ref }}
      deploy_root: ${{ inputs.deploy_root }}
      service_name: ${{ inputs.service_name }}
      display_name: Search
      concurrency_group: deploy-search-prod
      service_deploy_subdir: reader/search
      compose_file: reader/search/docker-compose.yml
      image_repo: adamwentworth/search_service
      image_env_var: SEARCH_IMAGE
      container_name: search_service
      compose_project_name: search
      health_url: http://127.0.0.1:3006/readyz
      health_label: search
      required_env_keys: JWT_SECRET DB_USER DB_PASSWORD DB_HOSTNAME DB_PORT DB_NAME
      kafka_network_mode: create

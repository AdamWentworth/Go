name: deploy-receiver-prod

on:
  workflow_dispatch:
    inputs:
      image_ref:
        description: "Image to deploy: full ref, or just tag (latest / sha-<commit>). Empty defaults to latest."
        required: false
        default: "latest"
        type: string
      deploy_root:
        description: "Absolute path to the prod deploy state root"
        required: false
        default: "/home/adam/deploy/Go"
        type: string
      service_name:
        description: "Compose service to deploy"
        required: false
        default: "receiver_service"
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Receiver To Prod
    uses: ./.github/workflows/deploy-compose-health-prod.yml
    with:
      image_ref: ${{ inputs.image_ref }}
      deploy_root: ${{ inputs.deploy_root }}
      service_name: ${{ inputs.service_name }}
      display_name: Receiver
      concurrency_group: deploy-receiver-prod
      service_deploy_subdir: receiver
      compose_file: receiver/docker-compose.yml
      image_repo: adamwentworth/receiver_service
      image_env_var: RECEIVER_IMAGE
      container_name: receiver_service
      compose_project_name: receiver
      health_url: http://127.0.0.1:3003/readyz
      health_label: receiver
      required_env_keys: JWT_SECRET
      kafka_network_mode: require

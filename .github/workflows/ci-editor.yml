name: ci-editor

on:
  pull_request:
    paths:
      - "editor/**"
      - "pokemon/data/pokego.db"
      - ".github/workflows/ci-editor.yml"
  push:
    branches: ["main", "master"]
    paths:
      - "editor/**"
      - "pokemon/data/pokego.db"
      - ".github/workflows/ci-editor.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Editor Test Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow requests beautifulsoup4

      - name: Validate Editor Python Syntax
        run: python -m compileall editor

      - name: Run Editor Unit Tests
        run: python -m unittest discover -s editor/tests -p "test_*.py" -v

name: rebuild-pokemon-catalog-from-sqlite-prod

on:
  workflow_dispatch:
    inputs:
      deploy_root:
        description: "Absolute path to the prod deploy state root"
        required: false
        default: "/srv/pokegonexus"
        type: string
      release_id:
        description: "Optional durable catalog release ID. Empty derives one from this commit."
        required: false
        default: ""
        type: string
      confirm_rebuild_from_sqlite:
        description: "I understand this recovery action replaces the live PostgreSQL catalog with the checked-in SQLite copy."
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  publish:
    name: Rebuild Pokemon Catalog From SQLite Recovery Copy
    runs-on: [self-hosted, linux, x64, prod]
    environment: production
    concurrency:
      group: publish-pokemon-catalog-prod
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true
          cache-dependency-path: pokemon/go.sum

      - name: Require Explicit Recovery Confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.confirm_rebuild_from_sqlite }}" != "true" ]]; then
            echo "Refusing to replace PostgreSQL catalog data without confirm_rebuild_from_sqlite=true." >&2
            exit 1
          fi

      - name: Rebuild Catalog With Backup And Rollback
        shell: bash
        run: |
          set -euo pipefail
          release_id="${{ inputs.release_id }}"
          if [[ -z "${release_id}" ]]; then
            release_id="catalog-${GITHUB_SHA}"
          fi
          bash ops/pokemon-catalog/publish-catalog-prod.sh \
            "${GITHUB_WORKSPACE}" \
            "${{ inputs.deploy_root }}" \
            "${GITHUB_WORKSPACE}/pokemon/data/pokego.db" \
            "${release_id}"

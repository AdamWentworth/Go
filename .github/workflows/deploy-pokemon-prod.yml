name: deploy-pokemon-prod

on:
  workflow_dispatch:
    inputs:
      image_ref:
        description: "Image to deploy: full ref, or just tag (latest / sha-<commit>). Empty defaults to latest."
        required: false
        default: "latest"
        type: string
      deploy_root:
        description: "Absolute path to the prod deploy state root"
        required: false
        default: "/srv/pokegonexus"
        type: string
      service_name:
        description: "Compose service to deploy"
        required: false
        default: "pokemon_data"
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Pokemon To Prod
    runs-on: [self-hosted, linux, x64, prod]
    environment: production
    concurrency:
      group: deploy-pokemon-prod
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set Up Go For Catalog Migrations
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache: true
          cache-dependency-path: pokemon/go.sum

      - name: Apply Pending Catalog Schema Migrations
        shell: bash
        run: |
          set -euo pipefail

          deploy_root="${{ inputs.deploy_root }}"
          pokemon_deploy_dir="${deploy_root}/pokemon"
          compose_file="${GITHUB_WORKSPACE}/pokemon/docker-compose.yml"
          database_env_file="${pokemon_deploy_dir}/catalog-db.env"
          publisher_env_file="${pokemon_deploy_dir}/catalog-publisher.env"

          [[ -f "${database_env_file}" ]] || {
            echo "Catalog database environment file is missing: ${database_env_file}" >&2
            exit 1
          }
          [[ -f "${publisher_env_file}" ]] || {
            echo "Catalog publisher environment file is missing: ${publisher_env_file}" >&2
            exit 1
          }

          docker compose \
            --project-name pokemon \
            --project-directory "${pokemon_deploy_dir}" \
            -f "${compose_file}" \
            --env-file "${database_env_file}" \
            up -d pokemon_catalog_db

          docker compose \
            --project-name pokemon \
            --project-directory "${pokemon_deploy_dir}" \
            -f "${compose_file}" \
            --env-file "${database_env_file}" \
            up -d pokemon_cache || echo "Warning: optional Redis L2 cache did not start; API fallback remains available."

          for _ in $(seq 1 30); do
            status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' pokemon_catalog_db 2>/dev/null || true)"
            if [[ "${status}" == "healthy" ]]; then
              break
            fi
            sleep 2
          done
          [[ "${status:-}" == "healthy" ]] || {
            docker logs --tail 200 pokemon_catalog_db || true
            echo "pokemon_catalog_db did not become healthy before schema migration." >&2
            exit 1
          }

          set -a
          # shellcheck disable=SC1090
          source "${publisher_env_file}"
          set +a
          [[ -n "${CATALOG_PUBLISHER_DATABASE_URL:-}" ]] || {
            echo "CATALOG_PUBLISHER_DATABASE_URL is missing from ${publisher_env_file}" >&2
            exit 1
          }

          (
            cd "${GITHUB_WORKSPACE}/pokemon"
            go run ./cmd/catalog-migrate --database-url "${CATALOG_PUBLISHER_DATABASE_URL}"
          )

      - name: Preflight Checks
        shell: bash
        run: |
          set -euo pipefail

          DEPLOY_ROOT="${{ inputs.deploy_root }}"
          POKEMON_DEPLOY_DIR="${DEPLOY_ROOT}/pokemon"
          COMPOSE_FILE="${GITHUB_WORKSPACE}/pokemon/docker-compose.yml"
          ENV_FILE="${POKEMON_DEPLOY_DIR}/.env"
          CATALOG_DB_ENV_FILE="${POKEMON_DEPLOY_DIR}/catalog-db.env"
          EDGE_NETWORK="pokemon_edge"
          EDGE_SUBNET="172.30.0.0/24"
          EDGE_GATEWAY="172.30.0.1"

          mkdir -p "${POKEMON_DEPLOY_DIR}"

          if [[ ! -f "${COMPOSE_FILE}" ]]; then
            echo "Compose file not found: ${COMPOSE_FILE}" >&2
            exit 1
          fi

          if [[ ! -f "${ENV_FILE}" ]]; then
            echo "Env file not found: ${ENV_FILE}" >&2
            exit 1
          fi

          if [[ ! -f "${CATALOG_DB_ENV_FILE}" ]]; then
            echo "Catalog database environment file not found: ${CATALOG_DB_ENV_FILE}" >&2
            echo "Provision the Pokemon catalog PostgreSQL service before deploying this compose stack." >&2
            exit 1
          fi

          if ! docker network inspect "${EDGE_NETWORK}" >/dev/null 2>&1; then
            echo "External docker network ${EDGE_NETWORK} not found; creating it now."
            docker network create \
              --driver bridge \
              --subnet "${EDGE_SUBNET}" \
              --gateway "${EDGE_GATEWAY}" \
              "${EDGE_NETWORK}"
          fi

          NETWORK_SUBNET="$(docker network inspect -f '{{(index .IPAM.Config 0).Subnet}}' "${EDGE_NETWORK}")"
          if [[ "${NETWORK_SUBNET}" != "${EDGE_SUBNET}" ]]; then
            echo "Network ${EDGE_NETWORK} exists but subnet is ${NETWORK_SUBNET}; expected ${EDGE_SUBNET}." >&2
            exit 1
          fi

          docker compose \
            --project-directory "${POKEMON_DEPLOY_DIR}" \
            -f "${COMPOSE_FILE}" \
            --env-file "${ENV_FILE}" \
            config >/dev/null

      - name: Deploy With Health Check And Rollback
        shell: bash
        run: |
          set -euo pipefail

          source "${GITHUB_WORKSPACE}/ops/prod/deploy-image-utils.sh"

          DEPLOY_ROOT="${{ inputs.deploy_root }}"
          POKEMON_DEPLOY_DIR="${DEPLOY_ROOT}/pokemon"
          SERVICE_NAME="${{ inputs.service_name }}"
          IMAGE_REPO="adamwentworth/pokemon_service_go"
          RAW_IMAGE_INPUT="${{ inputs.image_ref }}"
          TARGET_IMAGE="$(resolve_image_ref "${IMAGE_REPO}" "${RAW_IMAGE_INPUT}")"
          TARGET_DIGEST=""
          DEPLOY_IMAGE=""
          COMPOSE_FILE="${GITHUB_WORKSPACE}/pokemon/docker-compose.yml"
          ENV_FILE="${POKEMON_DEPLOY_DIR}/.env"
          CONTAINER_NAME="pokemon_data_container"
          COMPOSE_PROJECT_NAME="pokemon"

          prepare_rollback_image "${IMAGE_REPO}" "pokemon" "${CONTAINER_NAME}"

          echo "Pulling target image: ${TARGET_IMAGE}"
          docker pull "${TARGET_IMAGE}"
          select_deploy_image "${TARGET_IMAGE}" "${IMAGE_REPO}"

          # If an existing container with the same fixed name was created by another
          # compose project (for example old node pokemon_data stack), remove it first.
          EXISTING_PROJECT="$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.project" }}' "${CONTAINER_NAME}" 2>/dev/null || true)"
          if [[ -n "${EXISTING_PROJECT}" && "${EXISTING_PROJECT}" != "${COMPOSE_PROJECT_NAME}" ]]; then
            echo "Removing existing ${CONTAINER_NAME} from compose project ${EXISTING_PROJECT} before deploy."
            docker rm -f "${CONTAINER_NAME}"
          fi

          echo "Ensuring PostgreSQL is running before deploying ${SERVICE_NAME}"
          docker compose \
            --project-directory "${POKEMON_DEPLOY_DIR}" \
            -f "${COMPOSE_FILE}" \
            --env-file "${ENV_FILE}" \
            up -d pokemon_catalog_db

          echo "Starting the optional Redis L2 cache"
          docker compose \
            --project-directory "${POKEMON_DEPLOY_DIR}" \
            -f "${COMPOSE_FILE}" \
            --env-file "${ENV_FILE}" \
            up -d pokemon_cache || echo "Warning: optional Redis L2 cache did not start; deploying with PostgreSQL fallback."

          echo "Deploying ${SERVICE_NAME} with image ${DEPLOY_IMAGE}"
          POKEMON_IMAGE="${DEPLOY_IMAGE}" docker compose \
            --project-directory "${POKEMON_DEPLOY_DIR}" \
            -f "${COMPOSE_FILE}" \
            --env-file "${ENV_FILE}" \
            up -d --no-deps --force-recreate --no-build "${SERVICE_NAME}"

          CONTAINER_IP="$(docker inspect -f '{{with index .NetworkSettings.Networks "pokemon_edge"}}{{.IPAddress}}{{end}}' "${CONTAINER_NAME}" 2>/dev/null || true)"
          if [[ -z "${CONTAINER_IP}" ]]; then
            echo "Failed to determine container IP on pokemon_edge for ${CONTAINER_NAME}" >&2
            docker logs --tail 200 "${CONTAINER_NAME}" || true
            exit 1
          fi

          echo "Waiting for /readyz on ${CONTAINER_IP}:3001"
          HEALTH_OK=0
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 2 "http://${CONTAINER_IP}:3001/readyz" >/dev/null 2>&1; then
              HEALTH_OK=1
              break
            fi
            sleep 2
          done

          if [[ "${HEALTH_OK}" -ne 1 ]]; then
            echo "New deployment failed readiness checks." >&2
            echo "Container status:"
            docker ps -a --filter "name=${CONTAINER_NAME}" --format "table {{.Names}}\t{{.Status}}\t{{.Image}}" || true
            echo "Recent container logs:"
            docker logs --tail 200 "${CONTAINER_NAME}" || true
            echo "Current /readyz payload (if reachable):"
            curl -sS --max-time 3 "http://${CONTAINER_IP}:3001/readyz" || true
            ROLLBACK_TARGET="${ROLLBACK_IMAGE:-${PREVIOUS_IMAGE}}"
            if [[ -n "${ROLLBACK_TARGET}" ]]; then
              echo "Rolling back to ${ROLLBACK_TARGET}"
              POKEMON_IMAGE="${ROLLBACK_TARGET}" docker compose \
                --project-directory "${POKEMON_DEPLOY_DIR}" \
                -f "${COMPOSE_FILE}" \
                --env-file "${ENV_FILE}" \
                up -d --no-deps --force-recreate --no-build "${SERVICE_NAME}"
            else
              echo "Rollback skipped: previous image not found." >&2
              echo "Manual rollback option: deploy ${IMAGE_REPO}:latest"
            fi
            exit 1
          fi

          write_deploy_metadata \
            "${POKEMON_DEPLOY_DIR}/deployments/${SERVICE_NAME}.json" \
            "${SERVICE_NAME}" \
            "${RAW_IMAGE_INPUT}" \
            "${TARGET_IMAGE}" \
            "${TARGET_DIGEST}" \
            "${DEPLOY_IMAGE}" \
            "${CONTAINER_NAME}" \
            "${PREVIOUS_IMAGE}" \
            "${PREVIOUS_IMAGE_ID}" \
            "${ROLLBACK_IMAGE}"

          echo "Deployment succeeded."

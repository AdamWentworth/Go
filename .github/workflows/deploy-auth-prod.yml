name: deploy-auth-prod

on:
  workflow_dispatch:
    inputs:
      image_ref:
        description: "Image to deploy: full ref, or just tag (latest / sha-<commit>). Empty defaults to latest."
        required: false
        default: "latest"
        type: string
      deploy_root:
        description: "Absolute path to the prod deploy state root"
        required: false
        default: "/srv/pokegonexus"
        type: string
      service_name:
        description: "Compose service to deploy"
        required: false
        default: "auth_service"
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Auth To Prod
    uses: ./.github/workflows/deploy-compose-health-prod.yml
    with:
      image_ref: ${{ inputs.image_ref }}
      deploy_root: ${{ inputs.deploy_root }}
      service_name: ${{ inputs.service_name }}
      display_name: Auth
      concurrency_group: deploy-auth-prod
      service_deploy_subdir: authentication
      compose_file: authentication/docker-compose.yml
      image_repo: adamwentworth/authentication
      image_env_var: AUTH_IMAGE
      container_name: authentication_container
      compose_project_name: authentication
      health_url: http://127.0.0.1:3002/readyz
      health_label: auth
      required_env_keys: DATABASE_URL JWT_SECRET
      kafka_network_mode: create
      dependency_container: mongo_auth
      dependency_service: mongo_auth
      create_backups_dir: true

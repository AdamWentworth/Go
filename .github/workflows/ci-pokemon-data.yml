name: ci-pokemon-data

on:
  pull_request:
    paths:
      - "pokemon/**"
      - "monitoring/**"
      - "nginx/**"
      - ".github/workflows/ci-pokemon-data.yml"
  push:
    branches: ["main", "master"]
    paths:
      - "pokemon/**"
      - "monitoring/**"
      - "nginx/**"
      - ".github/workflows/ci-pokemon-data.yml"
  workflow_dispatch:
    inputs:
      publish_pokemon_db:
        description: "Package and publish pokemon/data/pokego.db even if this run was not triggered by a DB diff."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  detect-db-change:
    name: Detect Pokemon DB Change
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      reason: ${{ steps.detect.outputs.reason }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect Pokemon DB Changes
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
          FORCE_DB_ARTIFACT: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_pokemon_db }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          changed="false"
          reason="pokemon/data/pokego.db was not changed"
          changed_files=""
          zero_sha="0000000000000000000000000000000000000000"

          if [[ "${FORCE_DB_ARTIFACT}" == "true" ]]; then
            changed="true"
            reason="manual workflow_dispatch requested DB artifact publication"
          elif [[ "${EVENT_NAME}" == "pull_request" ]]; then
            changed_files="$(git diff --name-only "${PR_BASE_SHA}" "${PR_HEAD_SHA}")"
          elif [[ "${EVENT_NAME}" == "push" ]]; then
            if [[ -z "${EVENT_BEFORE}" || "${EVENT_BEFORE}" == "${zero_sha}" ]]; then
              changed_files="$(git diff-tree --no-commit-id --name-only -r "${EVENT_SHA}")"
            else
              changed_files="$(git diff --name-only "${EVENT_BEFORE}" "${EVENT_SHA}")"
            fi
          fi

          if [[ "${changed}" != "true" ]] && printf '%s\n' "${changed_files}" | grep -Fxq "pokemon/data/pokego.db"; then
            changed="true"
            reason="pokemon/data/pokego.db changed in this run"
          fi

          echo "changed=${changed}" >> "${GITHUB_OUTPUT}"
          echo "reason=${reason}" >> "${GITHUB_OUTPUT}"
          echo "${reason}"

  quality-gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pokemon

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          # Use a patched toolchain so govulncheck is not blocked by stdlib CVEs.
          go-version: "1.26.5"
          cache: true
          cache-dependency-path: pokemon/go.sum

      - name: Install tools
        run: |
          GOBIN=$(go env GOPATH)/bin go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.4.0
          go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Test
        run: go test ./...

      - name: Integration Contract Test
        run: go test -tags=integration ./internal/builder -run TestPokemonPayload_StableShape -v

      - name: SLO Gate (Warm Cache)
        run: go test -count=1 ./internal/api -run TestPokemonPokemons_WarmCacheSLO -v

      - name: Coverage Gates
        run: |
          set -euo pipefail

          go test -count=1 -coverprofile coverage_api.out ./internal/api
          go test -count=1 -coverprofile coverage_cache.out ./internal/cache
          go test -count=1 -tags=integration -coverprofile coverage_builder_int.out ./internal/builder

          api_cov=$(go tool cover -func=coverage_api.out | awk '/^total:/ {gsub("%","",$3); print $3}')
          cache_cov=$(go tool cover -func=coverage_cache.out | awk '/^total:/ {gsub("%","",$3); print $3}')
          builder_cov=$(go tool cover -func=coverage_builder_int.out | awk '/^total:/ {gsub("%","",$3); print $3}')

          echo "api coverage: ${api_cov}% (min 80%)"
          echo "cache coverage: ${cache_cov}% (min 70%)"
          echo "builder integration coverage: ${builder_cov}% (min 82%)"

          awk -v cov="$api_cov" 'BEGIN { if (cov+0 < 80) { exit 1 } }'
          awk -v cov="$cache_cov" 'BEGIN { if (cov+0 < 70) { exit 1 } }'
          awk -v cov="$builder_cov" 'BEGIN { if (cov+0 < 82) { exit 1 } }'

          rm -f coverage_api.out coverage_cache.out coverage_builder_int.out

      - name: Vet
        run: go vet ./...

      - name: Lint
        run: golangci-lint run

      - name: Govulncheck
        run: govulncheck ./...

  container-security-build:
    runs-on: ubuntu-latest
    needs: quality-gates
    env:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      IMAGE_REPO: adamwentworth/pokemon_service_go

    steps:
      - uses: actions/checkout@v5

      - name: Build Container Image
        run: |
          docker build -t pokemon_data:ci-${{ github.sha }} ./pokemon

      - name: Trivy Filesystem Scan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/trivy"
          docker run --rm \
            -v "$PWD:/workspace" \
            -v "$HOME/.cache/trivy:/root/.cache/" \
            ghcr.io/aquasecurity/trivy:0.65.0 \
            fs \
            --scanners vuln \
            --pkg-types os,library \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            /workspace/pokemon

      - name: Trivy Image Scan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/trivy"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/" \
            ghcr.io/aquasecurity/trivy:0.65.0 \
            image \
            --pkg-types os,library \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            pokemon_data:ci-${{ github.sha }}

      - name: Generate SBOM (CycloneDX)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/trivy"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/workspace" \
            -v "$HOME/.cache/trivy:/root/.cache/" \
            ghcr.io/aquasecurity/trivy:0.65.0 \
            image \
            --format cyclonedx \
            --output /workspace/pokemon_image_sbom.cdx.json \
            pokemon_data:ci-${{ github.sha }}

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v7
        with:
          name: pokemon-image-sbom
          path: pokemon_image_sbom.cdx.json
          if-no-files-found: error

      - name: DockerHub Login
        if: ${{ github.event_name != 'pull_request' && env.DOCKERHUB_TOKEN != '' }}
        run: |
          echo "${DOCKERHUB_TOKEN}" | docker login -u "adamwentworth" --password-stdin

      - name: Push Image To DockerHub
        if: ${{ github.event_name != 'pull_request' && env.DOCKERHUB_TOKEN != '' }}
        run: |
          docker tag pokemon_data:ci-${{ github.sha }} ${IMAGE_REPO}:sha-${{ github.sha }}
          docker tag pokemon_data:ci-${{ github.sha }} ${IMAGE_REPO}:latest
          docker push ${IMAGE_REPO}:sha-${{ github.sha }}
          docker push ${IMAGE_REPO}:latest

      - name: DockerHub Push Skipped
        if: ${{ github.event_name != 'pull_request' && env.DOCKERHUB_TOKEN == '' }}
        run: |
          echo "DockerHub push skipped. Set DOCKERHUB_TOKEN repository secret."

  pokemon-db-artifact:
    name: Package Pokemon DB Artifact
    runs-on: ubuntu-latest
    needs: [detect-db-change, quality-gates, container-security-build]
    if: ${{ github.event_name != 'pull_request' && needs.detect-db-change.outputs.changed == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
    permissions:
      contents: write
    outputs:
      artifact_name: ${{ steps.package.outputs.artifact_name }}
      db_sha256: ${{ steps.package.outputs.db_sha256 }}
      release_tag: ${{ steps.package.outputs.release_tag }}

    steps:
      - uses: actions/checkout@v5

      - name: Package Pokemon DB
        id: package
        shell: bash
        run: |
          bash ops/pokemon-db/package-pokemon-db.sh \
            pokemon/data/pokego.db \
            dist/pokemon-db \
            "${GITHUB_SHA}"

      - name: Upload Pokemon DB Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: |
            ${{ steps.package.outputs.package_path }}
            ${{ steps.package.outputs.manifest_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish Pokemon DB Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DB_SHA256: ${{ steps.package.outputs.db_sha256 }}
          MANIFEST_PATH: ${{ steps.package.outputs.manifest_path }}
          PACKAGE_PATH: ${{ steps.package.outputs.package_path }}
          RELEASE_TAG: ${{ steps.package.outputs.release_tag }}
        run: |
          set -euo pipefail

          release_title="Pokemon DB ${GITHUB_SHA:0:12}"
          release_notes="$(mktemp)"
          {
            echo "Pokemon SQLite database artifact for ${GITHUB_SHA}."
            echo
            echo "DB SHA256: ${DB_SHA256}"
          } > "${release_notes}"

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${PACKAGE_PATH}" "${MANIFEST_PATH}" --clobber
          else
            gh release create "${RELEASE_TAG}" \
              "${PACKAGE_PATH}" \
              "${MANIFEST_PATH}" \
              --target "${GITHUB_SHA}" \
              --title "${release_title}" \
              --notes-file "${release_notes}"
          fi

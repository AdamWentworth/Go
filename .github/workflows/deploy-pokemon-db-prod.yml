name: deploy-pokemon-db-prod

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Pokemon DB release tag to deploy. Empty deploys the newest pokemon-db-* release."
        required: false
        default: ""
        type: string
      image_ref:
        description: "Pokemon image to deploy with the DB. Empty uses sha-<source_commit> from the DB manifest."
        required: false
        default: ""
        type: string
      deploy_root:
        description: "Absolute path to the prod deploy state root"
        required: false
        default: "/srv/pokegonexus"
        type: string
      service_name:
        description: "Compose service to deploy"
        required: false
        default: "pokemon_data"
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Pokemon DB To Prod
    runs-on: [self-hosted, linux, x64, prod]
    environment: production
    concurrency:
      group: deploy-pokemon-db-prod
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Ensure GitHub CLI
        shell: bash
        run: |
          set -euo pipefail

          if command -v gh >/dev/null 2>&1; then
            gh --version
            exit 0
          fi

          install_dir="${RUNNER_TEMP:-/tmp}/gh-cli"
          rm -rf "${install_dir}"
          mkdir -p "${install_dir}/bin"

          release_json="${install_dir}/release.json"
          curl -fsSL https://api.github.com/repos/cli/cli/releases/latest -o "${release_json}"

          download_url="$(
            python3 - "${release_json}" <<'PY'
import json
import sys

with open(sys.argv[1], encoding="utf-8") as handle:
    release = json.load(handle)

for asset in release.get("assets", []):
    name = asset.get("name", "")
    if name.startswith("gh_") and name.endswith("_linux_amd64.tar.gz"):
        print(asset["browser_download_url"])
        break
else:
    raise SystemExit("No linux_amd64 GitHub CLI release asset found.")
PY
          )"

          archive="${install_dir}/gh.tar.gz"
          curl -fsSL "${download_url}" -o "${archive}"
          tar -xzf "${archive}" -C "${install_dir}"

          gh_bin="$(find "${install_dir}" -type f -path '*/bin/gh' -print -quit)"
          if [[ -z "${gh_bin}" ]]; then
            echo "Downloaded GitHub CLI archive did not contain bin/gh." >&2
            exit 1
          fi

          cp "${gh_bin}" "${install_dir}/bin/gh"
          chmod +x "${install_dir}/bin/gh"
          echo "${install_dir}/bin" >> "${GITHUB_PATH}"
          "${install_dir}/bin/gh" --version

      - name: Download Pokemon DB Release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
          IMAGE_REF_INPUT: ${{ inputs.image_ref }}
          IMAGE_REPO: adamwentworth/pokemon_service_go
        run: |
          set -euo pipefail

          source "${GITHUB_WORKSPACE}/ops/prod/deploy-image-utils.sh"

          release_tag="${RELEASE_TAG_INPUT}"
          if [[ -z "${release_tag}" ]]; then
            release_tag="$(gh release list \
              --limit 50 \
              --json tagName \
              --jq '[.[] | select(.tagName | startswith("pokemon-db-")) | .tagName][0]')"
          fi

          if [[ -z "${release_tag}" || "${release_tag}" == "null" ]]; then
            echo "No pokemon-db-* release was found." >&2
            exit 1
          fi

          release_dir="dist/pokemon-db-release"
          rm -rf "${release_dir}"
          mkdir -p "${release_dir}"

          gh release download "${release_tag}" \
            --pattern 'pokemon-db-*.tgz' \
            --dir "${release_dir}" \
            --clobber
          gh release download "${release_tag}" \
            --pattern '*.manifest.json' \
            --dir "${release_dir}" \
            --clobber

          package_path="$(find "${release_dir}" -maxdepth 1 -type f -name 'pokemon-db-*.tgz' -print -quit)"
          manifest_path="$(find "${release_dir}" -maxdepth 1 -type f -name '*.manifest.json' -print -quit)"

          if [[ -z "${package_path}" ]]; then
            echo "Pokemon DB package was not found in release ${release_tag}." >&2
            exit 1
          fi

          if [[ -z "${manifest_path}" ]]; then
            echo "Pokemon DB manifest was not found in release ${release_tag}." >&2
            exit 1
          fi

          source_commit="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("source_commit", ""))' "${manifest_path}")"

          if [[ -z "${source_commit}" ]]; then
            echo "source_commit missing from ${manifest_path}." >&2
            exit 1
          fi

          if [[ -z "${IMAGE_REF_INPUT}" ]]; then
            target_image="${IMAGE_REPO}:sha-${source_commit}"
          else
            target_image="$(resolve_image_ref "${IMAGE_REPO}" "${IMAGE_REF_INPUT}")"
          fi

          {
            echo "release_tag=${release_tag}"
            echo "package_path=${package_path}"
            echo "manifest_path=${manifest_path}"
            echo "source_commit=${source_commit}"
            echo "target_image=${target_image}"
          } >> "${GITHUB_OUTPUT}"

          echo "Selected Pokemon DB release: ${release_tag}"
          echo "Source commit: ${source_commit}"
          echo "Target image: ${target_image}"

      - name: Install Pokemon DB And Deploy Matching Image
        shell: bash
        run: |
          set -euo pipefail

          bash ops/pokemon-db/install-pokemon-db.sh \
            "${{ steps.release.outputs.package_path }}" \
            "${{ inputs.deploy_root }}" \
            "${GITHUB_WORKSPACE}/pokemon/docker-compose.yml" \
            "${{ steps.release.outputs.target_image }}" \
            "${{ inputs.service_name }}"

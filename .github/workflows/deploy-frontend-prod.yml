name: deploy-frontend-prod

on:
  workflow_dispatch:
    inputs:
      image_ref:
        description: "Image to deploy: full ref, or just tag (latest / sha-<commit>). Empty defaults to latest."
        required: false
        default: "latest"
        type: string
      deploy_root:
        description: "Absolute path to the prod deploy state root"
        required: false
        default: "/srv/pokegonexus"
        type: string
      service_name:
        description: "Compose service to deploy"
        required: false
        default: "frontend_nginx"
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Frontend To Prod
    runs-on: [self-hosted, linux, x64, prod]
    environment: production
    concurrency:
      group: deploy-frontend-prod
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Preflight Checks
        shell: bash
        run: |
          set -euo pipefail

          DEPLOY_ROOT="${{ inputs.deploy_root }}"
          FRONTEND_DEPLOY_DIR="${DEPLOY_ROOT}/nginx"
          COMPOSE_FILE="${GITHUB_WORKSPACE}/nginx/docker-compose.yml"
          KAFKA_NETWORK="kafka_default"
          EDGE_NETWORK="pokemon_edge"
          EDGE_SUBNET="172.30.0.0/24"
          EDGE_GATEWAY="172.30.0.1"

          mkdir -p "${FRONTEND_DEPLOY_DIR}"

          if [[ ! -f "${COMPOSE_FILE}" ]]; then
            echo "Compose file not found: ${COMPOSE_FILE}" >&2
            exit 1
          fi

          for cert_file in \
            /etc/letsencrypt/live/pokegonexus.com/fullchain.pem \
            /etc/letsencrypt/live/pokegonexus.com/privkey.pem \
            /etc/letsencrypt/live/pokemongonexus.com/fullchain.pem \
            /etc/letsencrypt/live/pokemongonexus.com/privkey.pem
          do
            if ! docker run --rm -v /etc/letsencrypt:/etc/letsencrypt:ro alpine:3.22 sh -c "test -f '${cert_file}'"; then
              echo "Required TLS file not found inside /etc/letsencrypt mount: ${cert_file}" >&2
              exit 1
            fi
          done

          if ! docker network inspect "${KAFKA_NETWORK}" >/dev/null 2>&1; then
            echo "External docker network ${KAFKA_NETWORK} not found; creating it now."
            docker network create "${KAFKA_NETWORK}"
          fi

          if ! docker network inspect "${EDGE_NETWORK}" >/dev/null 2>&1; then
            echo "External docker network ${EDGE_NETWORK} not found; creating it now."
            docker network create \
              --driver bridge \
              --subnet "${EDGE_SUBNET}" \
              --gateway "${EDGE_GATEWAY}" \
              "${EDGE_NETWORK}"
          fi

          NETWORK_SUBNET="$(docker network inspect -f '{{(index .IPAM.Config 0).Subnet}}' "${EDGE_NETWORK}")"
          if [[ "${NETWORK_SUBNET}" != "${EDGE_SUBNET}" ]]; then
            echo "Network ${EDGE_NETWORK} exists but subnet is ${NETWORK_SUBNET}; expected ${EDGE_SUBNET}." >&2
            exit 1
          fi

          docker compose \
            --project-directory "${FRONTEND_DEPLOY_DIR}" \
            -f "${COMPOSE_FILE}" \
            config >/dev/null

      - name: Deploy With Health Check And Rollback
        shell: bash
        run: |
          set -euo pipefail

          source "${GITHUB_WORKSPACE}/ops/prod/deploy-image-utils.sh"

          DEPLOY_ROOT="${{ inputs.deploy_root }}"
          FRONTEND_DEPLOY_DIR="${DEPLOY_ROOT}/nginx"
          SERVICE_NAME="${{ inputs.service_name }}"
          IMAGE_REPO="adamwentworth/frontend-nginx"
          RAW_IMAGE_INPUT="${{ inputs.image_ref }}"
          TARGET_IMAGE="$(resolve_image_ref "${IMAGE_REPO}" "${RAW_IMAGE_INPUT}")"
          TARGET_DIGEST=""
          DEPLOY_IMAGE=""
          COMPOSE_FILE="${GITHUB_WORKSPACE}/nginx/docker-compose.yml"
          CONTAINER_NAME="frontend_nginx"
          COMPOSE_PROJECT_NAME="nginx"

          mkdir -p "${FRONTEND_DEPLOY_DIR}"
          prepare_rollback_image "${IMAGE_REPO}" "frontend" "${CONTAINER_NAME}"

          echo "Pulling target image: ${TARGET_IMAGE}"
          docker pull "${TARGET_IMAGE}"
          select_deploy_image "${TARGET_IMAGE}" "${IMAGE_REPO}"

          EXISTING_PROJECT="$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.project" }}' "${CONTAINER_NAME}" 2>/dev/null || true)"
          if [[ -n "${EXISTING_PROJECT}" && "${EXISTING_PROJECT}" != "${COMPOSE_PROJECT_NAME}" ]]; then
            echo "Removing existing ${CONTAINER_NAME} from compose project ${EXISTING_PROJECT} before deploy."
            docker rm -f "${CONTAINER_NAME}"
          fi

          echo "Deploying ${SERVICE_NAME} with image ${DEPLOY_IMAGE}"
          FRONTEND_NGINX_IMAGE="${DEPLOY_IMAGE}" docker compose \
            --project-directory "${FRONTEND_DEPLOY_DIR}" \
            -f "${COMPOSE_FILE}" \
            up -d --no-deps --force-recreate --no-build "${SERVICE_NAME}"

          HEALTH_OK=0
          LAST_STATUS="000"
          HTTPS_STATUS="000"
          rm -f /tmp/frontend_health_body.txt

          for _ in $(seq 1 30); do
            LAST_STATUS="$(curl -sS -o /tmp/frontend_health_body.txt -w '%{http_code}' \
              http://127.0.0.1/ || true)"

            if [[ "${LAST_STATUS}" == "200" ]]; then
              HEALTH_OK=1
              break
            fi

            # HTTP can legitimately redirect to HTTPS in this stack.
            if [[ "${LAST_STATUS}" == "301" || "${LAST_STATUS}" == "302" ]]; then
              HTTPS_STATUS="$(curl -k -sS \
                -H 'Host: pokegonexus.com' \
                -o /tmp/frontend_health_body.txt \
                -w '%{http_code}' \
                https://127.0.0.1/ || true)"

              if [[ "${HTTPS_STATUS}" == "200" ]]; then
                HEALTH_OK=1
                LAST_STATUS="${LAST_STATUS}->${HTTPS_STATUS}"
                break
              fi
            fi

            sleep 2
          done

          if [[ "${HEALTH_OK}" -ne 1 ]]; then
            echo "New deployment failed health checks (last status: ${LAST_STATUS})." >&2
            echo "Last frontend health response body:" >&2
            cat /tmp/frontend_health_body.txt 2>/dev/null || true
            echo "Container status:" >&2
            docker ps -a --filter "name=${CONTAINER_NAME}" --format "table {{.Names}}\t{{.Status}}\t{{.Image}}" || true
            echo "Recent container logs:" >&2
            docker logs --tail 200 "${CONTAINER_NAME}" || true

            ROLLBACK_TARGET="${ROLLBACK_IMAGE:-${PREVIOUS_IMAGE}}"
            if [[ -n "${ROLLBACK_TARGET}" ]]; then
              echo "Rolling back to ${ROLLBACK_TARGET}"
              FRONTEND_NGINX_IMAGE="${ROLLBACK_TARGET}" docker compose \
                --project-directory "${FRONTEND_DEPLOY_DIR}" \
                -f "${COMPOSE_FILE}" \
                up -d --no-deps --force-recreate --no-build "${SERVICE_NAME}"
            else
              echo "Rollback skipped: previous image not found." >&2
              echo "Manual rollback option: deploy ${IMAGE_REPO}:latest"
            fi
            exit 1
          fi

          write_deploy_metadata \
            "${FRONTEND_DEPLOY_DIR}/deployments/${SERVICE_NAME}.json" \
            "${SERVICE_NAME}" \
            "${RAW_IMAGE_INPUT}" \
            "${TARGET_IMAGE}" \
            "${TARGET_DIGEST}" \
            "${DEPLOY_IMAGE}" \
            "${CONTAINER_NAME}" \
            "${PREVIOUS_IMAGE}" \
            "${PREVIOUS_IMAGE_ID}" \
            "${ROLLBACK_IMAGE}"

          rm -f /tmp/frontend_health_body.txt
          echo "Deployment succeeded."

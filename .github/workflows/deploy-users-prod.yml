name: deploy-users-prod

on:
  workflow_dispatch:
    inputs:
      image_ref:
        description: "Image to deploy: full ref, or just tag (latest / sha-<commit>). Empty defaults to latest."
        required: false
        default: "latest"
        type: string
      deploy_root:
        description: "Absolute path to the prod deploy state root"
        required: false
        default: "/home/adam/deploy/Go"
        type: string
      service_name:
        description: "Compose service to deploy"
        required: false
        default: "users_service"
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Users To Prod
    uses: ./.github/workflows/deploy-compose-health-prod.yml
    with:
      image_ref: ${{ inputs.image_ref }}
      deploy_root: ${{ inputs.deploy_root }}
      service_name: ${{ inputs.service_name }}
      display_name: Users
      concurrency_group: deploy-users-prod
      service_deploy_subdir: reader/users
      compose_file: reader/users/docker-compose.yml
      image_repo: adamwentworth/users_service
      image_env_var: USERS_IMAGE
      container_name: users_service
      compose_project_name: users
      health_url: http://127.0.0.1:3005/readyz
      health_label: users
      required_env_keys: JWT_SECRET DB_USER DB_PASSWORD DB_HOSTNAME DB_PORT DB_NAME
      kafka_network_mode: create

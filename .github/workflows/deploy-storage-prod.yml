name: deploy-storage-prod

on:
  workflow_dispatch:
    inputs:
      image_ref:
        description: "Image to deploy: full ref, or just tag (latest / sha-<commit>). Empty defaults to latest."
        required: false
        default: "latest"
        type: string
      deploy_root:
        description: "Absolute path to the prod deploy state root"
        required: false
        default: "/srv/pokegonexus"
        type: string
      service_name:
        description: "Compose service to deploy"
        required: false
        default: "storage_service"
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Storage To Prod
    runs-on: [self-hosted, linux, x64, prod]
    environment: production
    concurrency:
      group: deploy-storage-prod
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Preflight Checks
        shell: bash
        run: |
          set -euo pipefail

          DEPLOY_ROOT="${{ inputs.deploy_root }}"
          SERVICE_DEPLOY_DIR="${DEPLOY_ROOT}/storage"
          COMPOSE_FILE="${GITHUB_WORKSPACE}/storage/docker-compose.yml"
          ENV_FILE="${SERVICE_DEPLOY_DIR}/.env"
          KAFKA_NETWORK="kafka_default"

          if [[ ! -d "${SERVICE_DEPLOY_DIR}" ]]; then
            echo "Service deploy directory not found: ${SERVICE_DEPLOY_DIR}" >&2
            exit 1
          fi

          if [[ ! -f "${COMPOSE_FILE}" ]]; then
            echo "Compose file not found: ${COMPOSE_FILE}" >&2
            exit 1
          fi

          if [[ ! -f "${ENV_FILE}" ]]; then
            echo "Env file not found: ${ENV_FILE}" >&2
            exit 1
          fi

          for key in DB_USER DB_PASSWORD DB_HOSTNAME DB_PORT DB_NAME KAFKA_HOSTNAME KAFKA_PORT KAFKA_TOPIC; do
            if ! grep -qE "^${key}=" "${ENV_FILE}"; then
              echo "Required env key missing in ${ENV_FILE}: ${key}" >&2
              exit 1
            fi
          done

          if ! docker network inspect "${KAFKA_NETWORK}" >/dev/null 2>&1; then
            echo "External docker network ${KAFKA_NETWORK} not found; creating it now."
            docker network create "${KAFKA_NETWORK}"
          fi

          docker compose \
            --project-directory "${SERVICE_DEPLOY_DIR}" \
            -f "${COMPOSE_FILE}" \
            --env-file "${ENV_FILE}" \
            config >/dev/null

          # Ensure DB dependency is up before starting storage worker.
          if ! docker ps --format '{{.Names}}' | grep -qx 'mysql_storage'; then
            echo "mysql_storage is not running; starting mysql_storage first."
            docker compose \
              --project-directory "${SERVICE_DEPLOY_DIR}" \
              -f "${COMPOSE_FILE}" \
              --env-file "${ENV_FILE}" \
              up -d mysql_storage
          fi

      - name: Deploy With Process Checks And Rollback
        shell: bash
        run: |
          set -euo pipefail

          source "${GITHUB_WORKSPACE}/ops/prod/deploy-image-utils.sh"

          DEPLOY_ROOT="${{ inputs.deploy_root }}"
          SERVICE_DEPLOY_DIR="${DEPLOY_ROOT}/storage"
          SERVICE_NAME="${{ inputs.service_name }}"
          IMAGE_REPO="adamwentworth/storage_service"
          RAW_IMAGE_INPUT="${{ inputs.image_ref }}"
          TARGET_IMAGE="$(resolve_image_ref "${IMAGE_REPO}" "${RAW_IMAGE_INPUT}")"
          TARGET_DIGEST=""
          DEPLOY_IMAGE=""
          COMPOSE_FILE="${GITHUB_WORKSPACE}/storage/docker-compose.yml"
          ENV_FILE="${SERVICE_DEPLOY_DIR}/.env"
          CONTAINER_NAME="storage_service"
          COMPOSE_PROJECT_NAME="storage"

          prepare_rollback_image "${IMAGE_REPO}" "storage" "${CONTAINER_NAME}"

          echo "Pulling target image: ${TARGET_IMAGE}"
          docker pull "${TARGET_IMAGE}"
          select_deploy_image "${TARGET_IMAGE}" "${IMAGE_REPO}"

          EXISTING_PROJECT="$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.project" }}' "${CONTAINER_NAME}" 2>/dev/null || true)"
          if [[ -n "${EXISTING_PROJECT}" && "${EXISTING_PROJECT}" != "${COMPOSE_PROJECT_NAME}" ]]; then
            echo "Removing existing ${CONTAINER_NAME} from compose project ${EXISTING_PROJECT} before deploy."
            docker rm -f "${CONTAINER_NAME}"
          fi

          echo "Deploying ${SERVICE_NAME} with image ${DEPLOY_IMAGE}"
          echo "Applying storage MySQL migrations with ${DEPLOY_IMAGE}"
          STORAGE_IMAGE="${DEPLOY_IMAGE}" docker compose \
            --project-directory "${SERVICE_DEPLOY_DIR}" \
            -f "${COMPOSE_FILE}" \
            --env-file "${ENV_FILE}" \
            run --rm --no-deps storage_migrate

          STORAGE_IMAGE="${DEPLOY_IMAGE}" docker compose \
            --project-directory "${SERVICE_DEPLOY_DIR}" \
            -f "${COMPOSE_FILE}" \
            --env-file "${ENV_FILE}" \
            up -d --no-deps --force-recreate --no-build "${SERVICE_NAME}"

          HEALTH_OK=0
          for _ in $(seq 1 30); do
            STATUS="$(docker inspect -f '{{.State.Status}}' "${CONTAINER_NAME}" 2>/dev/null || true)"
            if [[ "${STATUS}" != "running" ]]; then
              sleep 2
              continue
            fi

            RECENT_LOGS="$(docker logs --since 1m "${CONTAINER_NAME}" 2>&1 || true)"
            if echo "${RECENT_LOGS}" | grep -q "Database connected successfully." && \
               echo "${RECENT_LOGS}" | grep -q "Kafka consumer subscribed to topic:"; then
              HEALTH_OK=1
              break
            fi
            sleep 2
          done

          if [[ "${HEALTH_OK}" -ne 1 ]]; then
            echo "New deployment failed process checks." >&2
            echo "Container status:" >&2
            docker ps -a --filter "name=${CONTAINER_NAME}" --format "table {{.Names}}\t{{.Status}}\t{{.Image}}" || true
            echo "Recent container logs:" >&2
            docker logs --tail 300 "${CONTAINER_NAME}" || true

            ROLLBACK_TARGET="${ROLLBACK_IMAGE:-${PREVIOUS_IMAGE}}"
            if [[ -n "${ROLLBACK_TARGET}" ]]; then
              echo "Rolling back to ${ROLLBACK_TARGET}"
              STORAGE_IMAGE="${ROLLBACK_TARGET}" docker compose \
                --project-directory "${SERVICE_DEPLOY_DIR}" \
                -f "${COMPOSE_FILE}" \
                --env-file "${ENV_FILE}" \
                up -d --no-deps --force-recreate --no-build "${SERVICE_NAME}"
            else
              echo "Rollback skipped: previous image not found." >&2
              echo "Manual rollback option: deploy adamwentworth/storage_service:latest"
            fi
            exit 1
          fi

          write_deploy_metadata \
            "${SERVICE_DEPLOY_DIR}/deployments/${SERVICE_NAME}.json" \
            "${SERVICE_NAME}" \
            "${RAW_IMAGE_INPUT}" \
            "${TARGET_IMAGE}" \
            "${TARGET_DIGEST}" \
            "${DEPLOY_IMAGE}" \
            "${CONTAINER_NAME}" \
            "${PREVIOUS_IMAGE}" \
            "${PREVIOUS_IMAGE_ID}" \
            "${ROLLBACK_IMAGE}"

          echo "Deployment succeeded."

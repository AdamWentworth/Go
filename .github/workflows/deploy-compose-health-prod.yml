name: deploy-compose-health-prod

on:
  workflow_call:
    inputs:
      image_ref:
        required: false
        default: "latest"
        type: string
      deploy_root:
        required: false
        default: "/home/adam/deploy/Go"
        type: string
      service_name:
        required: true
        type: string
      display_name:
        required: true
        type: string
      concurrency_group:
        required: true
        type: string
      service_deploy_subdir:
        required: true
        type: string
      compose_file:
        required: true
        type: string
      image_repo:
        required: true
        type: string
      image_env_var:
        required: true
        type: string
      container_name:
        required: true
        type: string
      compose_project_name:
        required: true
        type: string
      health_url:
        required: true
        type: string
      health_label:
        required: true
        type: string
      required_env_keys:
        required: false
        default: ""
        type: string
      kafka_network_mode:
        required: false
        default: "create"
        type: string
      dependency_container:
        required: false
        default: ""
        type: string
      dependency_service:
        required: false
        default: ""
        type: string
      create_backups_dir:
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.display_name }} To Prod
    runs-on: [self-hosted, linux, x64, prod]
    environment: production
    concurrency:
      group: ${{ inputs.concurrency_group }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Preflight Checks
        shell: bash
        run: |
          set -euo pipefail

          DEPLOY_ROOT="${{ inputs.deploy_root }}"
          SERVICE_DEPLOY_DIR="${DEPLOY_ROOT}/${{ inputs.service_deploy_subdir }}"
          COMPOSE_FILE="${GITHUB_WORKSPACE}/${{ inputs.compose_file }}"
          ENV_FILE="${SERVICE_DEPLOY_DIR}/.env"
          REQUIRED_ENV_KEYS="${{ inputs.required_env_keys }}"
          KAFKA_NETWORK="kafka_default"
          KAFKA_NETWORK_MODE="${{ inputs.kafka_network_mode }}"
          DEPENDENCY_CONTAINER="${{ inputs.dependency_container }}"
          DEPENDENCY_SERVICE="${{ inputs.dependency_service }}"

          if [[ ! -d "${SERVICE_DEPLOY_DIR}" ]]; then
            echo "Service deploy directory not found: ${SERVICE_DEPLOY_DIR}" >&2
            exit 1
          fi

          if [[ ! -f "${COMPOSE_FILE}" ]]; then
            echo "Compose file not found: ${COMPOSE_FILE}" >&2
            exit 1
          fi

          if [[ ! -f "${ENV_FILE}" ]]; then
            echo "Env file not found: ${ENV_FILE}" >&2
            exit 1
          fi

          for key in ${REQUIRED_ENV_KEYS}; do
            if ! grep -qE "^${key}=" "${ENV_FILE}"; then
              echo "Required env key missing in ${ENV_FILE}: ${key}" >&2
              exit 1
            fi
          done

          case "${KAFKA_NETWORK_MODE}" in
            create)
              if ! docker network inspect "${KAFKA_NETWORK}" >/dev/null 2>&1; then
                echo "External docker network ${KAFKA_NETWORK} not found; creating it now."
                docker network create "${KAFKA_NETWORK}"
              fi
              ;;
            require)
              if ! docker network inspect "${KAFKA_NETWORK}" >/dev/null 2>&1; then
                echo "Required external network missing: ${KAFKA_NETWORK}" >&2
                exit 1
              fi
              ;;
            none)
              ;;
            *)
              echo "Unsupported kafka_network_mode: ${KAFKA_NETWORK_MODE}" >&2
              exit 1
              ;;
          esac

          if [[ "${{ inputs.create_backups_dir }}" == "true" ]]; then
            mkdir -p "${SERVICE_DEPLOY_DIR}/backups"
          fi

          docker compose \
            --project-directory "${SERVICE_DEPLOY_DIR}" \
            -f "${COMPOSE_FILE}" \
            --env-file "${ENV_FILE}" \
            config >/dev/null

          if [[ -n "${DEPENDENCY_CONTAINER}" && -n "${DEPENDENCY_SERVICE}" ]]; then
            if ! docker ps --format '{{.Names}}' | grep -qx "${DEPENDENCY_CONTAINER}"; then
              echo "${DEPENDENCY_CONTAINER} is not running; starting ${DEPENDENCY_SERVICE} first."
              docker compose \
                --project-directory "${SERVICE_DEPLOY_DIR}" \
                -f "${COMPOSE_FILE}" \
                --env-file "${ENV_FILE}" \
                up -d "${DEPENDENCY_SERVICE}"
            fi
          fi

      - name: Deploy With Health Check And Rollback
        shell: bash
        run: |
          set -euo pipefail

          DEPLOY_ROOT="${{ inputs.deploy_root }}"
          SERVICE_DEPLOY_DIR="${DEPLOY_ROOT}/${{ inputs.service_deploy_subdir }}"
          SERVICE_NAME="${{ inputs.service_name }}"
          IMAGE_REPO="${{ inputs.image_repo }}"
          IMAGE_ENV_VAR="${{ inputs.image_env_var }}"
          RAW_IMAGE_INPUT="${{ inputs.image_ref }}"
          TARGET_IMAGE=""
          COMPOSE_FILE="${GITHUB_WORKSPACE}/${{ inputs.compose_file }}"
          ENV_FILE="${SERVICE_DEPLOY_DIR}/.env"
          CONTAINER_NAME="${{ inputs.container_name }}"
          COMPOSE_PROJECT_NAME="${{ inputs.compose_project_name }}"
          HEALTH_URL="${{ inputs.health_url }}"
          HEALTH_LABEL="${{ inputs.health_label }}"
          HEALTH_BODY_FILE="/tmp/${HEALTH_LABEL}_health_body.txt"

          if [[ -z "${RAW_IMAGE_INPUT}" ]]; then
            TARGET_IMAGE="${IMAGE_REPO}:latest"
          elif [[ "${RAW_IMAGE_INPUT}" == :* ]]; then
            TARGET_IMAGE="${IMAGE_REPO}${RAW_IMAGE_INPUT}"
          elif [[ "${RAW_IMAGE_INPUT}" == */* ]]; then
            TARGET_IMAGE="${RAW_IMAGE_INPUT}"
          else
            TARGET_IMAGE="${IMAGE_REPO}:${RAW_IMAGE_INPUT}"
          fi

          if [[ "${TARGET_IMAGE}" == */* && "${TARGET_IMAGE}" != *:* && "${TARGET_IMAGE}" != *@* ]]; then
            TARGET_IMAGE="${TARGET_IMAGE}:latest"
          fi

          PREVIOUS_IMAGE="$(docker inspect --format '{{.Config.Image}}' "${CONTAINER_NAME}" 2>/dev/null || true)"
          if [[ -n "${PREVIOUS_IMAGE}" ]]; then
            echo "Previous image: ${PREVIOUS_IMAGE}"
          else
            echo "No existing container image found for ${CONTAINER_NAME}; rollback image will be unavailable."
          fi

          echo "Pulling target image: ${TARGET_IMAGE}"
          docker pull "${TARGET_IMAGE}"

          EXISTING_PROJECT="$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.project" }}' "${CONTAINER_NAME}" 2>/dev/null || true)"
          if [[ -n "${EXISTING_PROJECT}" && "${EXISTING_PROJECT}" != "${COMPOSE_PROJECT_NAME}" ]]; then
            echo "Removing existing ${CONTAINER_NAME} from compose project ${EXISTING_PROJECT} before deploy."
            docker rm -f "${CONTAINER_NAME}"
          fi

          echo "Deploying ${SERVICE_NAME} with image ${TARGET_IMAGE}"
          env "${IMAGE_ENV_VAR}=${TARGET_IMAGE}" docker compose \
            --project-directory "${SERVICE_DEPLOY_DIR}" \
            -f "${COMPOSE_FILE}" \
            --env-file "${ENV_FILE}" \
            up -d --no-deps --force-recreate --no-build "${SERVICE_NAME}"

          HEALTH_OK=0
          LAST_STATUS="000"
          rm -f "${HEALTH_BODY_FILE}"

          for _ in $(seq 1 30); do
            LAST_STATUS="$(curl -sS -o "${HEALTH_BODY_FILE}" -w '%{http_code}' \
              "${HEALTH_URL}" || true)"

            if [[ "${LAST_STATUS}" == "200" ]]; then
              HEALTH_OK=1
              break
            fi

            sleep 2
          done

          if [[ "${HEALTH_OK}" -ne 1 ]]; then
            echo "New deployment failed health checks (last status: ${LAST_STATUS})." >&2
            echo "Last ${HEALTH_LABEL} health response body:" >&2
            cat "${HEALTH_BODY_FILE}" 2>/dev/null || true
            echo "Container status:" >&2
            docker ps -a --filter "name=${CONTAINER_NAME}" --format "table {{.Names}}\t{{.Status}}\t{{.Image}}" || true
            echo "Recent container logs:" >&2
            docker logs --tail 200 "${CONTAINER_NAME}" || true

            if [[ -n "${PREVIOUS_IMAGE}" ]]; then
              echo "Rolling back to ${PREVIOUS_IMAGE}"
              env "${IMAGE_ENV_VAR}=${PREVIOUS_IMAGE}" docker compose \
                --project-directory "${SERVICE_DEPLOY_DIR}" \
                -f "${COMPOSE_FILE}" \
                --env-file "${ENV_FILE}" \
                up -d --no-deps --force-recreate --no-build "${SERVICE_NAME}"
            else
              echo "Rollback skipped: previous image not found." >&2
              echo "Manual rollback option: deploy ${IMAGE_REPO}:latest"
            fi
            exit 1
          fi

          rm -f "${HEALTH_BODY_FILE}"
          echo "Deployment succeeded."

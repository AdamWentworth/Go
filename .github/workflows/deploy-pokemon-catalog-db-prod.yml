name: deploy-pokemon-catalog-db-prod

on:
  workflow_dispatch:
    inputs:
      deploy_root:
        description: "Absolute path to the prod deploy state root"
        required: false
        default: "/srv/pokegonexus"
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Dedicated Pokemon Catalog PostgreSQL
    runs-on: [self-hosted, linux, x64, prod]
    environment: production
    concurrency:
      group: deploy-pokemon-catalog-db-prod
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5

      - name: Deploy Catalog PostgreSQL
        shell: bash
        run: |
          set -euo pipefail

          deploy_root="${{ inputs.deploy_root }}"
          deploy_dir="${deploy_root}/pokemon"
          source_compose="${GITHUB_WORKSPACE}/pokemon/catalog-postgres.compose.yml"
          compose_file="${deploy_dir}/catalog-postgres.compose.yml"
          env_file="${deploy_dir}/catalog-db.env"
          container_name="pokemon_catalog_db"
          network_name="pokemon_catalog_internal"

          [[ -f "${env_file}" ]] || {
            echo "Catalog database is not provisioned: ${env_file} is missing." >&2
            exit 1
          }
          install -d -m 700 "${deploy_dir}"
          install -m 644 "${source_compose}" "${compose_file}"

          if ! docker network inspect "${network_name}" >/dev/null 2>&1; then
            docker network create "${network_name}" >/dev/null
          fi

          docker compose \
            --project-name pokemon-catalog \
            --project-directory "${deploy_dir}" \
            -f "${compose_file}" \
            --env-file "${env_file}" \
            config >/dev/null

          docker compose \
            --project-name pokemon-catalog \
            --project-directory "${deploy_dir}" \
            -f "${compose_file}" \
            --env-file "${env_file}" \
            up -d pokemon_catalog_db

          for _ in $(seq 1 30); do
            status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "${container_name}" 2>/dev/null || true)"
            if [[ "${status}" == "healthy" ]]; then
              echo "${container_name} is healthy"
              exit 0
            fi
            sleep 2
          done

          docker logs --tail 200 "${container_name}" || true
          echo "${container_name} failed its PostgreSQL health check" >&2
          exit 1

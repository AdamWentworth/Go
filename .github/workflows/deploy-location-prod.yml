name: deploy-location-prod

on:
  workflow_dispatch:
    inputs:
      image_ref:
        description: "Image to deploy: full ref, or just tag (latest / sha-<commit>). Empty defaults to latest."
        required: false
        default: "latest"
        type: string
      deploy_root:
        description: "Absolute path to the prod deploy state root"
        required: false
        default: "/home/adam/deploy/Go"
        type: string
      service_name:
        description: "Compose service to deploy"
        required: false
        default: "location_service"
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Location To Prod
    uses: ./.github/workflows/deploy-compose-health-prod.yml
    with:
      image_ref: ${{ inputs.image_ref }}
      deploy_root: ${{ inputs.deploy_root }}
      service_name: ${{ inputs.service_name }}
      display_name: Location
      concurrency_group: deploy-location-prod
      service_deploy_subdir: location
      compose_file: location/docker-compose.yml
      image_repo: adamwentworth/location_service
      image_env_var: LOCATION_IMAGE
      container_name: location_service
      compose_project_name: location
      health_url: http://127.0.0.1:3007/readyz
      health_label: location
      required_env_keys: DB_USER DB_PASSWORD DB_HOST DB_PORT DB_NAME
      kafka_network_mode: create

name: deploy-events-prod

on:
  workflow_dispatch:
    inputs:
      image_ref:
        description: "Image to deploy: full ref, or just tag (latest / sha-<commit>). Empty defaults to latest."
        required: false
        default: "latest"
        type: string
      deploy_root:
        description: "Absolute path to the prod deploy state root"
        required: false
        default: "/srv/pokegonexus"
        type: string
      service_name:
        description: "Compose service to deploy"
        required: false
        default: "events_service"
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Events To Prod
    uses: ./.github/workflows/deploy-compose-health-prod.yml
    with:
      image_ref: ${{ inputs.image_ref }}
      deploy_root: ${{ inputs.deploy_root }}
      service_name: ${{ inputs.service_name }}
      display_name: Events
      concurrency_group: deploy-events-prod
      service_deploy_subdir: reader/events
      compose_file: reader/events/docker-compose.yml
      image_repo: adamwentworth/events_service
      image_env_var: EVENTS_IMAGE
      container_name: events_service
      compose_project_name: events
      health_url: http://127.0.0.1:3008/readyz
      health_label: events
      required_env_keys: JWT_SECRET DB_USER DB_PASSWORD DB_HOSTNAME DB_PORT DB_NAME KAFKA_HOSTNAME KAFKA_PORT KAFKA_TOPIC
      kafka_network_mode: create

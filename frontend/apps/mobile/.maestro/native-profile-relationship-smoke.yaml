appId: host.exp.exponent
name: Native trainer profile relationship smoke
tags:
  - android
  - native-profile
---
- openLink:
    link: exp://10.0.2.2:8091/--/device-smoke/profile-relationship
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "^Continue$"
    commands:
      - tapOn: "^Continue$"
- runFlow:
    when:
      visible: React Native dev menu
    commands:
      - tapOn: Close
- extendedWaitUntil:
    visible: Cancel friend request?
    timeout: 45000
- assertVisible: Your pending request to Misty will be canceled.
- tapOn: Cancel request
- assertVisible: Friend request canceled.
- assertVisible: TRAINER PROFILE
- assertVisible: CeruleanLeader
- assertVisible: Add friend
- tapOn: Add friend
- assertVisible: Friend request sent.
- assertVisible: Request sent
- tapOn: Request sent
- assertVisible: Cancel friend request?
- tapOn: Cancel request
- assertVisible: Friend request canceled.
- scrollUntilVisible:
    element:
      text: Block trainer
    direction: DOWN
    timeout: 10000
- tapOn: Block trainer
- assertVisible: Block Misty?
- tapOn: Block trainer
- assertVisible: Trainer blocked.
- scrollUntilVisible:
    element:
      text: Blocked
    direction: DOWN
    timeout: 10000
- assertVisible: Blocked
- takeScreenshot: native-trainer-profile-relationship

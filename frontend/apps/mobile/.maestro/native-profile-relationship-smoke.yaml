appId: host.exp.exponent
name: Native trainer profile relationship smoke
tags:
  - android
  - native-profile
---
- openLink:
    link: exp://10.0.2.2:8091/--/device-smoke/profile-relationship
- runFlow:
    when:
      visible: "This is the developer menu.*"
    commands:
      - tapOn: Continue
- runFlow:
    when:
      visible: React Native dev menu
    commands:
      - tapOn: Close
- extendedWaitUntil:
    visible: Cancel friend request?
    timeout: 45000
- assertVisible: Your pending request to Misty will be canceled.
- tapOn: Cancel request
- assertVisible: Friend request canceled.
- assertVisible: TRAINER PROFILE
- assertVisible: CeruleanLeader
- assertVisible: Add friend
- takeScreenshot: native-trainer-profile-relationship

      visible: React Native dev menu
    commands:
      - tapOn: Close
- extendedWaitUntil:
    visible: TRAINER DASHBOARD
    timeout: 45000
- assertVisible: "Welcome back,.*VisualTrainerGO"
- assertVisible: Find Pokémon
- assertVisible: QUICK NAVIGATION
- takeScreenshot: home-01-top
- tapOn: Dismiss quick navigation hint
- assertNotVisible: QUICK NAVIGATION
- scrollUntilVisible:

appId: host.exp.exponent
name: Native account security parity smoke
tags:
  - android
  - native-account
---
- openLink:
    link: exp://10.0.2.2:8091/--/device-smoke/account
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "^Continue$"
    commands:
      - tapOn: "^Continue$"
- runFlow:
    when:
      visible: React Native dev menu
    commands:
      - tapOn: Close
- extendedWaitUntil:
    visible: LOGIN IDENTITY
    timeout: 45000
- assertVisible: Account details
- tapOn: Username
- eraseText: 20
- inputText: TrainerTwo
- hideKeyboard
- assertVisible: Save username
- tapOn: Save username
- assertVisible: Username saved.
- tapOn: Dismiss message
- tapOn: Current password
- inputText: Valid_password_42!
- hideKeyboard
- scrollUntilVisible:
    element:
      text: Send verification email
    direction: DOWN
    timeout: 10000
- tapOn: Email address
- eraseText: 40
- inputText: trainer.updated@example.com
- hideKeyboard
- tapOn: Send verification email
- assertVisible: Verification email sent.
- tapOn: Dismiss message
- scrollUntilVisible:
    element:
      text: Update password
    direction: DOWN
    timeout: 10000
- tapOn: New password
- inputText: Stronger_password_43!
- scrollUntilVisible:
    element:
      text: Confirm new password
    direction: DOWN
    timeout: 10000
- tapOn: Confirm new password
- inputText: Stronger_password_43!
- hideKeyboard
- tapOn: Update password
- assertVisible: Password change validated.
- tapOn: Dismiss message
- scrollUntilVisible:
    element:
      text: Connected accounts
    direction: DOWN
    timeout: 10000
- scrollUntilVisible:
    element:
      text: trainer@gmail.com
    direction: DOWN
    timeout: 10000
- assertVisible: trainer@gmail.com
- tapOn: Disconnect Google
- assertVisible: Disconnect Google?
- assertVisible: Current password
- tapOn: Disconnect
- assertVisible: Google disconnected.
- tapOn: Dismiss message
- assertVisible: Connect Google
- tapOn: Connect Google
- assertVisible: Google connected.
- tapOn: Dismiss message
- tapOn: Connect Discord
- assertVisible: Discord connected.
- tapOn: Dismiss message
- scrollUntilVisible:
    element:
      text: Sign out all devices
    direction: DOWN
    timeout: 10000
- tapOn: Sign out all devices
- assertVisible: Sign out every device?
- assertVisible: Current password
- tapOn: Sign out all
- assertVisible: All sessions revoked.
- tapOn: Dismiss message
- assertNotVisible: All sessions revoked.
- scrollUntilVisible:
    element:
      id: native-account-delete-button
    direction: DOWN
    timeout: 20000
- tapOn:
    id: native-account-delete-button
- extendedWaitUntil:
    visible: Permanently delete your account?
    timeout: 10000
- takeScreenshot: native-account-security-confirmation
- tapOn: Cancel
- assertVisible: Delete account
- takeScreenshot: native-account-security

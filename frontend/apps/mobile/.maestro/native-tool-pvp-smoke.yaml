appId: host.exp.exponent
name: Native PvP tool smoke
---
- openLink: "exp://10.0.2.2:8091/--/device-smoke/tools?tool=pvp"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "^Continue$"
    commands:
      - tapOn: "^Continue$"
- runFlow:
    when:
      visible: React Native dev menu
    commands:
      - tapOn: Close
- assertVisible: "PvP Rankings"
- assertVisible: "Bulbasaur"
- tapOn: "Team Builder"
- assertVisible: "Choose team members"
- tapOn: "Battle Lab"
- assertVisible: "Simulate a focused matchup"
- tapOn: "Simulate battle"
- assertVisible: "SIMULATED RESULT"
- scrollUntilVisible:
    element:
      text: "IV Rank"
    direction: UP
    speed: 40
    timeout: 15000
- tapOn: "IV Rank"
- assertVisible: "Rank one IV spread"
- takeScreenshot: "native-tool-pvp"

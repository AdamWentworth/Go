appId: host.exp.exponent
name: Native PvP tool smoke
---
- openLink: "exp://10.0.2.2:8091/--/device-smoke/tools?tool=pvp"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "^Continue$"
    commands:
      - tapOn: "^Continue$"
- runFlow:
    when:
      visible: React Native dev menu
    commands:
      - tapOn: Close
- assertVisible: "PvP Rankings"
- assertVisible: "Bulbasaur"
- takeScreenshot: "native-pvp-rankings"
- tapOn: "Team Builder"
- assertVisible: "THREE-POKÉMON TEAM"
- runFlow:
    when:
      visible: "Remove Bulbasaur from Lead"
    commands:
      - tapOn: "Remove Bulbasaur from Lead"
- runFlow:
    when:
      visible: "Remove Ivysaur from Safe Swap"
    commands:
      - tapOn: "Remove Ivysaur from Safe Swap"
- assertVisible: "0 / 3"
- takeScreenshot: "native-pvp-team-builder-empty"
- scrollUntilVisible:
    element:
      text: "Add suggested Bulbasaur"
    direction: DOWN
    speed: 40
    timeout: 15000
- tapOn: "Add suggested Bulbasaur"
- scrollUntilVisible:
    element:
      text: "Add suggested Ivysaur"
    direction: DOWN
    speed: 40
    timeout: 15000
- tapOn: "Add suggested Ivysaur"
- assertVisible: "2 / 3"
- takeScreenshot: "native-pvp-team-builder-filled"
- scrollUntilVisible:
    element:
      text: "Battle Lab"
    direction: UP
    speed: 40
    timeout: 15000
- tapOn: "Battle Lab"
- assertVisible: "Simulate a focused matchup"
- scrollUntilVisible:
    element:
      text: "Simulate battle"
    direction: DOWN
    speed: 40
    timeout: 15000
- tapOn: "Simulate battle"
- assertVisible: "SIMULATED RESULT"
- scrollUntilVisible:
    element:
      text: "♟ Team battle"
    direction: UP
    speed: 40
    timeout: 15000
- tapOn: "♟ Team battle"
- assertVisible: "Switching"
- scrollUntilVisible:
    element:
      text: "Run team battle"
    direction: DOWN
    speed: 40
    timeout: 15000
- tapOn: "Run team battle"
- scrollUntilVisible:
    element:
      text: "SWITCH-AWARE 3V3 RESULT"
    direction: DOWN
    speed: 40
    timeout: 20000
- assertVisible: "SWITCH-AWARE 3V3 RESULT"
- takeScreenshot: "native-pvp-team-battle-result"
- scrollUntilVisible:
    element:
      text: "Test meta teams"
    direction: UP
    speed: 40
    timeout: 15000
- tapOn: "Test meta teams"
- scrollUntilVisible:
    element:
      text: "ROLE-BALANCED META FIELD"
    direction: DOWN
    speed: 40
    timeout: 20000
- assertVisible: "ROLE-BALANCED META FIELD"
- scrollUntilVisible:
    element:
      text: "IV Rank"
    direction: UP
    speed: 40
    timeout: 15000
- tapOn: "IV Rank"
- assertVisible: "Find the strongest IV spread for this league"
- tapOn: "Bulbasaur"
- scrollUntilVisible:
    element:
      text: "RANK 1 SPREAD"
    direction: DOWN
    speed: 40
    timeout: 15000
- assertVisible: "RANK 1 SPREAD"
- takeScreenshot: "native-pvp-iv-rank"

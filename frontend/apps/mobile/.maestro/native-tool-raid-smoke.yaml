appId: host.exp.exponent
name: Native Raid tool smoke
---
- openLink: "exp://10.0.2.2:8091/--/device-smoke/tools?tool=raid"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "^Continue$"
    commands:
      - tapOn: "^Continue$"
- runFlow:
    when:
      visible: React Native dev menu
    commands:
      - tapOn: Close
- assertVisible: "Raid Planner"
- assertVisible: "Attacker rankings"
- assertVisible: "ALL TYPES"
- assertVisible: "Top raid attackers"
- takeScreenshot: "native-tool-raid-rankings"
- tapOn: "Ranking settings"
- assertVisible: "Ranking conditions"
- assertVisible: "Attacker level"
- takeScreenshot: "native-tool-raid-settings"
- tapOn: "Ranking settings"
- tapOn: "Boss counters"
- assertVisible: "RAID BOSS"
- assertVisible: "Bulbasaur"
- assertVisible: "Search raid bosses"
- takeScreenshot: "native-tool-raid-boss"
- tapOn: "Ranking settings"
- scrollUntilVisible:
    element:
      text: "Dodging"
    direction: DOWN
- assertVisible: "Boss behavior"
- scrollUntilVisible:
    element:
      text: "Shadow boss state"
    direction: DOWN
- takeScreenshot: "native-tool-raid-boss-settings"
- scrollUntilVisible:
    element:
      text: "Ranking settings"
    direction: UP
- tapOn: "Ranking settings"
- tapOn: "Raid setup"
- scrollUntilVisible:
    element:
      text: "BOSS HP"
    direction: DOWN
- assertVisible: "COMFORTABLE"
- takeScreenshot: "native-tool-raid-setup"
- scrollUntilVisible:
    element:
      text: "Battle calibration"
    direction: DOWN
- tapOn: "◷  Log raid"
- assertVisible: "Log the actual result"
- assertVisible: "ACTUAL CLEAR TIME (SECONDS)"
- takeScreenshot: "native-tool-raid-log"
- tapOn: "Close raid log"

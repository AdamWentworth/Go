appId: host.exp.exponent
name: Native Raid tool smoke
---
- openLink: "exp://10.0.2.2:8091/--/device-smoke/tools?tool=raid"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "^Continue$"
    commands:
      - tapOn: "^Continue$"
- runFlow:
    when:
      visible: React Native dev menu
    commands:
      - tapOn: Close
- assertVisible: "Raid Planner"
- assertVisible: "Attacker rankings"
- assertVisible: "ALL TYPES"
- assertVisible: "Top raid attackers"
- takeScreenshot: "native-tool-raid-rankings"
- tapOn: "Ranking settings"
- assertVisible: "Ranking conditions"
- assertVisible: "Attacker level"
- takeScreenshot: "native-tool-raid-settings"
- tapOn: "Ranking settings"
- tapOn: "Boss counters"
- assertVisible: "RAID BOSS"
- assertVisible: "Bulbasaur"
- assertVisible: "Search raid bosses"
- takeScreenshot: "native-tool-raid-boss"
- tapOn: "Raid setup"
- assertVisible: "BOSS HP"
- assertVisible: "COMFORTABLE"
- takeScreenshot: "native-tool-raid-setup"

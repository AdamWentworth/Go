appId: host.exp.exponent
name: Native Trade Board smoke
---
- openLink: "exp://10.0.2.2:8091/--/device-smoke/public?page=trade-board"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "^Continue$"
    commands:
      - tapOn: "^Continue$"
- runFlow:
    when:
      visible: React Native dev menu
    commands:
      - tapOn: Close
- assertVisible: "Trade Board"
- assertVisible: "Shiny Gigantamax Charizard"
- scrollUntilVisible:
    element:
      text: "Gigantamax Blastoise"
    direction: DOWN
    timeout: 10000
- assertVisible: "Gigantamax Blastoise"
- scrollUntilVisible:
    element:
      text: "Nexus Light"
    direction: UP
    timeout: 10000
- tapOn: "Nexus Light"
- tapOn: "Include Looking For Pokémon"
- assertNotVisible: "Gigantamax Blastoise"
- scrollUntilVisible:
    element:
      text: "Share live link"
    direction: DOWN
    speed: 40
    timeout: 15000
- assertVisible: "Share live link"
- assertVisible: "Share board image"
- takeScreenshot: "native-trade-board"

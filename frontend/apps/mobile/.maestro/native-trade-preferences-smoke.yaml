appId: host.exp.exponent
name: Native trade-preferences parity smoke
tags:
  - android
  - native-trades
  - trade-preferences
---
- openLink:
    link: exp://10.0.2.2:8091/--/device-smoke/trade-preferences
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "^Continue$"
    commands:
      - tapOn:
          text: "^Continue$"
          optional: true
- runFlow:
    when:
      visible: React Native dev menu
    commands:
      - tapOn: Close
- extendedWaitUntil:
    visible: Trade Preferences
    timeout: 45000
- assertVisible: "^For Trade \\([0-9]+\\)$"
- assertVisible: "^Wanted \\([0-9]+\\)$"
- assertVisible: Shiny Bulbasaur
- assertVisible: WANTED POKÉMON
- assertVisible: Edit preferences
- tapOn: Trade Activity
- extendedWaitUntil:
    visible: Your trades
    timeout: 10000
- assertVisible: No trades here
- takeScreenshot: 00-trade-activity-page
- tapOn: Trade Preferences
- extendedWaitUntil:
    visible: WANTED POKÉMON
    timeout: 10000
- swipe:
    start: "50%,82%"
    end: "50%,54%"
    duration: 500
- extendedWaitUntil:
    visible: Shiny Charmander
    timeout: 10000
- assertNotVisible: Shiny Mewtwo
- takeScreenshot: 01-for-trade-view
- tapOn: "^Wanted \\([0-9]+\\)$"
- tapOn: "^For Trade \\([0-9]+\\)$"
- extendedWaitUntil:
    visible: Edit preferences
    timeout: 10000
- tapOn: Edit preferences
- assertVisible: Save changes
- tapOn: No additional rules
- assertVisible: Mirror trade
- swipe:
    start: "50%,66%"
    end: "50%,44%"
    duration: 500
- extendedWaitUntil:
    visible: Must match
    timeout: 10000
- swipe:
    start: "50%,66%"
    end: "50%,40%"
    duration: 500
- extendedWaitUntil:
    visible: Leave out
    timeout: 10000
- takeScreenshot: 02-for-trade-edit-rules
- swipe:
    start: "50%,66%"
    end: "50%,35%"
    duration: 500
- swipe:
    start: "50%,66%"
    end: "50%,35%"
    duration: 500
- swipe:
    start: "50%,66%"
    end: "50%,35%"
    duration: 500
- swipe:
    start: "50%,66%"
    end: "50%,35%"
    duration: 500
- extendedWaitUntil:
    visible:
      id: preference-candidate-wanted-metagross
    timeout: 10000
- tapOn:
    id: preference-candidate-wanted-metagross
- tapOn: Save changes
- extendedWaitUntil:
    visible: Preferences saved.
    timeout: 10000
- tapOn:
    text: "^Wanted \\([0-9]+\\)$"
- extendedWaitUntil:
    visible: FOR TRADE POKÉMON
    timeout: 10000
- swipe:
    start: "50%,82%"
    end: "50%,54%"
    duration: 500
- extendedWaitUntil:
    visible: Shiny Bulbasaur
    timeout: 10000
- assertVisible: Shiny Gigantamax Charizard
- takeScreenshot: 03-wanted-view

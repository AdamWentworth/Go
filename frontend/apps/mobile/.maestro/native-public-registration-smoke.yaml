appId: host.exp.exponent
name: Native registration workflow smoke
---
- openLink: "exp://10.0.2.2:8091/--/device-smoke/public?page=register"
- assertVisible: "Create your account"
- assertVisible: "Sign up with Google"
- assertVisible: "Sign up with Discord"
- assertVisible: "Sign up with Facebook"
- tapOn: ".*Continue with email.*"
- assertVisible: "YOUR ACCOUNT"
- tapOn: "Username"
- inputText: "VisualTrainer"
- pressKey: ENTER
- inputText: "visual@example.invalid"
- pressKey: ENTER
- extendedWaitUntil:
    visible: "PROTECT YOUR ACCOUNT"
    timeout: 15000
- takeScreenshot: "native-registration-password-step"
- tapOn: Password
- inputText: "Strong_password_42"
- tapOn: Confirm password
- inputText: "Strong_password_42"
- hideKeyboard
- tapOn: "Continue ›"
- assertVisible: "POKÉMON GO IDENTITY"
- tapOn: "Continue ›"
- assertVisible: "YOUR AREA"
- tapOn: "Continue ›"
- assertVisible: "READY TO JOIN"
- assertVisible: "VisualTrainer"
- assertVisible: "visual@example.invalid"
- tapOn: "Create account ✓"
- extendedWaitUntil:
    visible: "Account created."
    timeout: 10000
- takeScreenshot: "native-registration-complete"

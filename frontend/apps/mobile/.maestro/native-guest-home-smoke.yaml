      visible: React Native dev menu
    commands:
      - tapOn: Close
- extendedWaitUntil:
    visible: THE ULTIMATE TRAINER HUB
    timeout: 45000
- assertVisible: Bring every catch, wishlist, and trade into one connected place.
- assertVisible: QUICK NAVIGATION
- assertVisible: Tap the Poké Ball below to explore the app.
- takeScreenshot: 01-guest-hero-and-hint
- tapOn: Open action menu from tip
- assertNotVisible: QUICK NAVIGATION
- assertVisible: Navigate action-menu
- scrollUntilVisible:

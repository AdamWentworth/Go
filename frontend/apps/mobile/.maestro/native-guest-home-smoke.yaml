      text: One clear trading workflow
    direction: DOWN
    timeout: 10000
- assertVisible: Exact collection
- assertVisible: Reciprocal trading
- scrollUntilVisible:
    element:
      text: Trainer tools
    direction: DOWN
    timeout: 10000
- scrollUntilVisible:

appId: host.exp.exponent
name: Native search workflow smoke
tags:
  - android
  - native-search
---
- openLink:
    link: exp://10.0.2.2:8091/--/device-smoke/search
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "^Continue$"
    commands:
      - tapOn: "^Continue$"
- runFlow:
    when:
      visible: React Native dev menu
    commands:
      - tapOn: Close
- extendedWaitUntil:
    visible: Search
    timeout: 45000
- assertVisible: ".*Pokémon.*"
- assertVisible: ".*Trainers.*"
- assertVisible: Shiny Pikachu
- scrollUntilVisible:
    element:
      text: MUTUAL MATCH
    direction: DOWN
    timeout: 10000
- assertVisible: MUTUAL MATCH
- assertVisible: Gigantamax Charizard
- takeScreenshot: search-01-results
- scrollUntilVisible:
    element:
      id: native-search-map-view
    direction: UP
    timeout: 10000
- tapOn:
    id: native-search-map-view
- assertVisible:
    id: native-search-map
- assertVisible: "1 on map"
- scrollUntilVisible:
    element:
      text: "OtherTrainer"
    direction: DOWN
    timeout: 10000
- assertVisible: "OtherTrainer"
- takeScreenshot: search-01b-map
- scrollUntilVisible:
    element:
      id: native-search-list-view
    direction: UP
    timeout: 10000
- tapOn:
    id: native-search-list-view
- assertNotVisible:
    id: native-search-map
- scrollUntilVisible:
    element:
      text: Modify search
    direction: UP
    timeout: 10000
- tapOn: Modify search
- assertVisible: LOOKING FOR
- assertVisible: Pikachu
- takeScreenshot: search-01c-primary-controls
- tapOn: Filters
- extendedWaitUntil:
    visible: Refine your search
    timeout: 10000
- assertVisible: ".*Pokémon.*"
- assertVisible: ".*Location.*"
- assertVisible: ".*Matching.*"
- assertVisible: Shiny
- takeScreenshot: search-02-filters
- tapOn: Location
- assertVisible: Where should we look\?
- assertVisible: City or place
- assertVisible: Distance and results
- takeScreenshot: search-02b-location-filters
- tapOn: Matching
- assertVisible: Mutual matches only
- tapOn: Apply & search.*
- scrollUntilVisible:
    element:
      text: ".*SEARCH COMPLETE.*"
    direction: UP
    timeout: 10000
- assertVisible: ".*SEARCH COMPLETE.*"
- tapOn: Trainer search
- extendedWaitUntil:
    visible: Find a trainer
    timeout: 10000
- tapOn: Username or Pokémon GO name
- inputText: Other
- hideKeyboard
- scrollUntilVisible:
    element:
      text: Nexus · @OtherTrainer
    direction: DOWN
    timeout: 10000
- assertVisible: Nexus · @OtherTrainer
- assertVisible: Pokémon GO · OtherPogoName
- takeScreenshot: search-03-trainers

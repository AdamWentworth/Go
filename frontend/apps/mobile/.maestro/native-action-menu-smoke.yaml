appId: host.exp.exponent
name: Native action menu system-window smoke
tags:
  - android
  - native-action-menu
---
- openLink:
    link: exp://10.0.2.2:8091/--/device-smoke/collection
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "^Continue$"
    commands:
      - tapOn: "^Continue$"
- runFlow:
    when:
      visible: React Native dev menu
    commands:
      - tapOn: Close
- extendedWaitUntil:
    visible: POKÉMON
    timeout: 45000
- tapOn:
    id: native-action-menu-anchor
- extendedWaitUntil:
    visible: Quick navigation
    timeout: 10000
- assertVisible: Share Trade Board
- assertVisible: Learn & support
- assertVisible: Use dark theme
- tapOn: Use dark theme
- assertVisible: Use light theme
- takeScreenshot: action-menu-system-window
- tapOn: Close
- assertNotVisible: Quick navigation
- tapOn:
    id: native-action-menu-anchor
- assertVisible: Use light theme
- tapOn: Use light theme
- assertVisible: Use dark theme
- tapOn: Close

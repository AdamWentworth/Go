appId: host.exp.exponent
name: Native trainer settings parity smoke
tags:
  - android
  - native-settings
---
- openLink:
    link: exp://10.0.2.2:8091/--/device-smoke/settings
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "^Continue$"
    commands:
      - tapOn: "^Continue$"
- runFlow:
    when:
      visible: React Native dev menu
    commands:
      - tapOn: Close
- extendedWaitUntil:
    visible: WHO CAN SEE YOU
    timeout: 45000
- assertVisible: Privacy
- takeScreenshot: native-trainer-settings-privacy
- tapOn: "Profile visibility, Everyone"
- assertVisible: Profile visibility
- tapOn: Friends only
- assertVisible: "Profile visibility, Friends only"
- tapOn: Show profile location
- tapOn: Save privacy
- assertVisible: Privacy settings saved.
- tapOn: Dismiss message
- scrollUntilVisible:
    element:
      text: Trade coordination
    direction: DOWN
    timeout: 10000
- scrollUntilVisible:
    element:
      text: Discord
    direction: DOWN
    timeout: 10000
- assertVisible: Discord
- tapOn: "Preferred coordination method, Discord"
- assertVisible: Preferred coordination method
- tapOn: Campfire
- assertVisible: "Preferred coordination method, Campfire"
- scrollUntilVisible:
    element:
      text: Coordination handle
    direction: DOWN
    timeout: 10000
- tapOn: Coordination handle
- eraseText: 40
- inputText: MistyCampfire
- hideKeyboard
- scrollUntilVisible:
    element:
      text: Save coordination
    direction: DOWN
    timeout: 10000
- tapOn: Save coordination
- assertVisible: Trade coordination settings saved.
- tapOn: Dismiss message
- scrollUntilVisible:
    element:
      text: "Color theme, (Light|Dark)"
    direction: DOWN
    timeout: 10000
- assertVisible: Color theme
- runFlow:
    when:
      visible: "Color theme, Dark"
    commands:
      - tapOn: "Color theme, Dark"
      - tapOn: Light
      - assertVisible: "Color theme, Light"
      - tapOn: "Color theme, Light"
      - tapOn: Dark
      - assertVisible: "Color theme, Dark"
- runFlow:
    when:
      visible: "Color theme, Light"
    commands:
      - tapOn: "Color theme, Light"
      - tapOn: Dark
      - assertVisible: "Color theme, Dark"
      - tapOn: "Color theme, Dark"
      - tapOn: Light
      - assertVisible: "Color theme, Light"
- scrollUntilVisible:
    element:
      text: Reduce motion
    direction: DOWN
    timeout: 10000
- tapOn: Reduce motion
- scrollUntilVisible:
    element:
      text: Up to date
    direction: DOWN
    timeout: 10000
- assertVisible: Pokémon synchronization
- assertVisible: Up to date
- tapOn: Retry now
- takeScreenshot: native-trainer-settings

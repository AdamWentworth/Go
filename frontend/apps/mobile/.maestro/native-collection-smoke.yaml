appId: host.exp.exponent
name: Native collection runtime and interaction smoke
tags:
  - android
  - native-collection
---
- openLink:
    link: exp://10.0.2.2:8091/--/device-smoke/collection
- runFlow:
    when:
      visible: "This is the developer menu.*"
    commands:
      - tapOn: Continue
- runFlow:
    when:
      visible: React Native dev menu
    commands:
      - tapOn: Close
- extendedWaitUntil:
    visible: POKÉMON
    timeout: 45000
- extendedWaitUntil:
    visible: Bulbasaur
    timeout: 45000
- assertVisible: Shiny Bulbasaur
- assertVisible: Shadow Bulbasaur
- assertNotVisible: For Trade
- takeScreenshot: 01-pokemon-grid
- tapOn: Search Pokémon
- extendedWaitUntil:
    visible: Variants
    timeout: 10000
- assertNotVisible: View Bulbasaur
- takeScreenshot: 01b-search-filters
- hideKeyboard
- tapOn:
    text: ^Shiny$
- extendedWaitUntil:
    visible: Shiny Bulbasaur
    timeout: 10000
- assertNotVisible: View Bulbasaur
- tapOn: Clear Pokémon search
- extendedWaitUntil:
    visible: Variants
    timeout: 10000
- tapOn: Close Pokémon search
- extendedWaitUntil:
    visible: Bulbasaur
    timeout: 10000
- tapOn: Sort by NUMBER ascending
- extendedWaitUntil:
    visible: COMBAT POWER
    timeout: 10000
- assertVisible: RECENT
- assertVisible: FAVORITE
- assertVisible: HP
- takeScreenshot: 01c-sort-menu
- tapOn:
    text: ^NAME$
- assertVisible: Sort by NAME ascending
- tapOn: Sort by NAME ascending
- tapOn:
    text: ^NUMBER$
- assertVisible: Sort by NUMBER ascending
- tapOn: TAGS
- extendedWaitUntil:
    visible: Inventory tags
    timeout: 10000
- assertVisible: "Open For Trade, 3 Pokémon"
- scrollUntilVisible:
    element:
      text: "Open Shadow Shinies, 2 Pokémon"
    direction: DOWN
- assertVisible: "Open Shadow Shinies, 2 Pokémon"
- takeScreenshot: 02-inventory-tags
- scrollUntilVisible:
    element:
      text: "Open For Trade, 3 Pokémon"
    direction: UP
- tapOn: "Open For Trade, 3 Pokémon"
- extendedWaitUntil:
    visible: "(FOR TRADE)"
    timeout: 10000
- assertVisible: Shiny Gigantamax Charizard
- assertVisible: Shiny Suicune
- takeScreenshot: 03-for-trade-glows
- tapOn: Clear For Trade tag filter
- extendedWaitUntil:
    visible: Bulbasaur
    timeout: 10000
- assertVisible: Shiny Bulbasaur
- assertNotVisible: Shiny Suicune
- takeScreenshot: 04-catalog-restored
- tapOn: TAGS
- tapOn: "Open For Trade, 3 Pokémon"
- swipe:
    start: 90%, 50%
    end: 10%, 50%
    duration: 500
- extendedWaitUntil:
    visible: Wanted tags
    timeout: 10000
- assertVisible: Most Wanted
- takeScreenshot: 05-wishlist-tags
- tapOn: "Open Most Wanted, 2 Pokémon"
- extendedWaitUntil:
    visible: "(MOST WANTED)"
    timeout: 10000
- assertVisible: Gigantamax Blastoise
- tapOn: "View Gigantamax Blastoise"
- extendedWaitUntil:
    visible: WANTED CONDITIONS
    timeout: 10000
- assertVisible: Gigantamax Blastoise
- assertVisible: MOST WANTED
- takeScreenshot: 06-wanted-instance
- tapOn: Close
- assertNotVisible: WANTED CONDITIONS
- tapOn: TAGS
- tapOn: "Open For Trade, 3 Pokémon"
- tapOn: "View Shiny Gigantamax Charizard"
- assertVisible: FOR TRADE
- assertVisible: Wanted Pokémon
- takeScreenshot: 06b-for-trade-instance
- tapOn: Close
- tapOn: Clear For Trade tag filter
- tapOn: TAGS
- tapOn: "Open Favorites, 3 Pokémon"
- tapOn: "View Shiny Shadow Venusaur"
- assertVisible: Shiny Shadow Venusaur
- assertVisible: Remove Favorite
- takeScreenshot: 06c-caught-instance
- tapOn: Close
- tapOn: Open action menu
- extendedWaitUntil:
    visible: Quick navigation
    timeout: 10000
- assertVisible: Raid
- assertVisible: Search
- assertVisible: Pokémon
- assertVisible: Pokedex
- assertVisible: Home
- assertVisible: PvP
- assertVisible: Trades
- assertVisible: Rankings
- assertVisible: Max Battles
- takeScreenshot: 07-action-menu
- tapOn: Close
- assertNotVisible: Quick navigation

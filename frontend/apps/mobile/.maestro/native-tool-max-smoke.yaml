appId: host.exp.exponent
name: Native Max Battles tool smoke
---
- openLink: "exp://10.0.2.2:8091/--/device-smoke/tools?tool=max"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "^Continue$"
    commands:
      - tapOn: "^Continue$"
- runFlow:
    when:
      visible: React Native dev menu
    commands:
      - tapOn: Close
- extendedWaitUntil:
    visible: "Max Battles"
    timeout: 45000
- assertVisible: "Top damage dealers"
- takeScreenshot: "native-tool-max-initial"
- tapOn: "Tank"
- assertVisible: "Top tanks"
- tapOn: "Boss teams"
- assertVisible: "RECOMMENDED PARTY"
- assertVisible: "Standard play"
- takeScreenshot: "native-tool-max"

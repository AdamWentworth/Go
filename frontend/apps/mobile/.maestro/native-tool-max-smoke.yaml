appId: host.exp.exponent
name: Native Max Battles tool smoke
---
- openLink: "exp://10.0.2.2:8091/--/device-smoke/tools?tool=max"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "^Continue$"
    commands:
      - tapOn: "^Continue$"
- runFlow:
    when:
      visible: React Native dev menu
    commands:
      - tapOn: Close
- extendedWaitUntil:
    visible: "Max Battles"
    timeout: 45000
- tapOn: "Tank"
- assertVisible: "Top tank rankings"
- tapOn: "Boss teams"
- assertVisible: "BOSS TEAM"
- takeScreenshot: "native-tool-max"

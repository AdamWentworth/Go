appId: ${APP_ID}
name: Native collection production-mode performance probe
tags:
  - android
  - native-collection
  - performance
---
- openLink:
    link: ${APP_LINK_BASE}/device-smoke/collection?interaction=1
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "^Continue$"
    commands:
      - tapOn:
          text: "^Continue$"
          optional: true
- runFlow:
    when:
      visible: React Native dev menu
    commands:
      - tapOn: Close
- extendedWaitUntil:
    visible: POKÉMON
    timeout: 45000
- extendedWaitUntil:
    visible: Bulbasaur
    timeout: 45000
- tapOn: TAGS
- extendedWaitUntil:
    visible: Inventory tags
    timeout: 10000
- tapOn: "Open For Trade, 3 Pokémon"
- extendedWaitUntil:
    visible: "(TRADE)"
    timeout: 10000
- assertVisible: Shiny Gigantamax Charizard
- tapOn: Search Pokémon
- extendedWaitUntil:
    visible: Variants
    timeout: 10000
- tapOn:
    id: native-collection-filter-shiny
- extendedWaitUntil:
    visible: Shiny Gigantamax Charizard
    timeout: 10000

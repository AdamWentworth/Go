appId: ${APP_ID}
name: Native password recovery smoke
---
- openLink: "${APP_LINK_BASE}/device-smoke/public?page=reset"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "^Continue$"
    commands:
      - tapOn:
          text: "^Continue$"
          optional: true
- runFlow:
    when:
      visible: React Native dev menu
    commands:
      - tapOn: Close
- assertVisible: "Reset your password"
- tapOn: "Username or email"
- inputText: "visual@example.invalid"
- tapOn: "Email reset link"
- assertVisible: "Check your email"
- openLink: "${APP_LINK_BASE}/device-smoke/public?page=reset-confirm"
- assertVisible: "Choose a new password"
- assertVisible: "Update password"
- takeScreenshot: "native-password-recovery"

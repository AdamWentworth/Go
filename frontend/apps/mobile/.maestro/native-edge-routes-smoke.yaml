appId: host.exp.exponent
name: Native not-found and incomplete verification routes smoke
tags:
  - android
  - native-routing
---
- openLink:
    link: exp://10.0.2.2:8091/--/native/not-found?path=%2Fmissing-trainer-tool
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "^Continue$"
    commands:
      - tapOn: "^Continue$"
- runFlow:
    when:
      visible: React Native dev menu
    commands:
      - tapOn: Close
- extendedWaitUntil:
    visible: "404"
    timeout: 45000
- assertVisible: This route got away
- assertVisible: /missing-trainer-tool
- assertVisible: Open home
- takeScreenshot: 01-not-found
- openLink:
    link: exp://10.0.2.2:8091/--/native/verify-email-change
- extendedWaitUntil:
    visible: Email not updated
    timeout: 15000
- assertVisible: This verification link is incomplete.
- assertVisible: Continue to sign in
- takeScreenshot: 02-incomplete-email-verification

appId: ${APP_ID}
name: Native authoritative trade-activity smoke
tags:
  - android
  - native-trades
---
- openLink:
    link: ${APP_LINK_BASE}/device-smoke/trade-activity
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "^Continue$"
    commands:
      - tapOn:
          text: "^Continue$"
          optional: true
- runFlow:
    when:
      visible: React Native dev menu
    commands:
      - tapOn: Close
- extendedWaitUntil:
    visible: Your trades
    timeout: 45000
- assertVisible: Offers
- assertVisible: Sent
- assertVisible: Active
- assertVisible: Done
- assertVisible: Closed
- assertVisible: Needs your response
- assertVisible: YOU OFFER
- assertVisible: OTHERTRAINER OFFERS
- assertVisible: Gigantamax Charizard
- assertVisible: Shiny Mewtwo
- takeScreenshot: 01-incoming-remote-offer
- tapOn:
    id: trade-filter-Proposed
- assertVisible: Waiting for trainer
- assertVisible: Shiny Dialga
- assertVisible: Shiny Remoraid
- takeScreenshot: 02-sent-lucky-trade
- scrollUntilVisible:
    element:
      id: trade-action-cancel-sent
    direction: DOWN
    speed: 70
    visibilityPercentage: 100
    centerElement: true
    timeout: 30000
- tapOn:
    id: trade-action-cancel-sent
- assertVisible: Cancel this trade?
- tapOn: Cancel trade
- extendedWaitUntil:
    visible: Trade updated from the server response.
    timeout: 10000
- assertVisible: No trades here
- takeScreenshot: 03-server-confirmed-cancel
- scrollUntilVisible:
    element:
      id: trade-filter-Pending
    direction: UP
    speed: 70
    visibilityPercentage: 100
    timeout: 30000
- tapOn:
    id: trade-filter-Pending
- assertVisible: Ready to confirm
- scrollUntilVisible:
    element:
      id: trade-action-coordinate-active
    direction: DOWN
    speed: 70
    visibilityPercentage: 100
    centerElement: true
    timeout: 30000
- tapOn:
    id: trade-action-coordinate-active
- extendedWaitUntil:
    visible: COORDINATE EXTERNALLY
    timeout: 10000
- assertVisible: "Pokémon GO name: OtherPogoName"
- assertVisible: "Trainer code: 1234 5678 9012"
- assertVisible: Pokémon Go Nexus does not include chat.*
- takeScreenshot: 04-external-coordination
- tapOn: Done
- scrollUntilVisible:
    element:
      id: trade-filter-Accepting
    direction: UP
    speed: 70
    visibilityPercentage: 100
    timeout: 30000
- tapOn:
    id: trade-filter-Accepting
- extendedWaitUntil:
    visible: Shiny Mewtwo
    timeout: 10000
- scrollUntilVisible:
    element:
      id: trade-action-accept-incoming
    direction: DOWN
    speed: 70
    visibilityPercentage: 100
    centerElement: true
    timeout: 30000
- tapOn:
    id: trade-action-accept-incoming
- assertVisible: Accept this offer?
- tapOn: Accept offer
- extendedWaitUntil:
    visible: Trade updated from the server response.
    timeout: 10000
- assertNotVisible: Shiny Mewtwo
- scrollUntilVisible:
    element:
      id: trade-action-deny-incoming-deny
    direction: DOWN
    speed: 70
    visibilityPercentage: 100
    centerElement: true
    timeout: 30000
- tapOn:
    id: trade-action-deny-incoming-deny
- assertVisible: Deny this offer?
- tapOn: Deny offer
- extendedWaitUntil:
    visible: No trades here
    timeout: 10000
- scrollUntilVisible:
    element:
      id: trade-filter-Pending
    direction: UP
    speed: 70
    visibilityPercentage: 100
    timeout: 30000
- tapOn:
    id: trade-filter-Pending
- extendedWaitUntil:
    visible: Shiny Mewtwo
    timeout: 10000
- scrollUntilVisible:
    element:
      id: trade-action-complete-active-completable
    direction: DOWN
    speed: 70
    visibilityPercentage: 100
    centerElement: true
    timeout: 30000
- tapOn:
    id: trade-action-complete-active-completable
- assertVisible: Confirm the exchange happened?
- tapOn: Confirm complete
- extendedWaitUntil:
    visible: Trade updated from the server response.
    timeout: 10000
- assertNotVisible: Shiny Rayquaza
- scrollUntilVisible:
    element:
      id: trade-filter-Completed
    direction: UP
    speed: 70
    visibilityPercentage: 100
    timeout: 30000
- tapOn:
    id: trade-filter-Completed
- extendedWaitUntil:
    visible: Shiny Ho-Oh
    timeout: 10000
- scrollUntilVisible:
    element:
      id: trade-action-satisfy-completed
    direction: DOWN
    speed: 70
    visibilityPercentage: 100
    centerElement: true
    timeout: 30000
- tapOn:
    id: trade-action-satisfy-completed
- assertVisible: Mark this trade as satisfying?
- tapOn: Save feedback
- extendedWaitUntil:
    visible: Trade updated from the server response.
    timeout: 10000
- assertNotVisible:
    id: trade-action-satisfy-completed
- scrollUntilVisible:
    element:
      id: trade-action-delete-completed-delete
    direction: DOWN
    speed: 70
    visibilityPercentage: 100
    centerElement: true
    timeout: 30000
- tapOn:
    id: trade-action-delete-completed-delete
- assertVisible: Remove this trade from history?
- tapOn: Remove trade
- extendedWaitUntil:
    visible: Trade updated from the server response.
    timeout: 10000
- assertNotVisible: Shiny Lugia
- scrollUntilVisible:
    element:
      id: trade-filter-Cancelled
    direction: UP
    speed: 70
    visibilityPercentage: 100
    timeout: 30000
- tapOn:
    id: trade-filter-Cancelled
- extendedWaitUntil:
    visible: Shiny Dialga
    timeout: 10000
- scrollUntilVisible:
    element:
      id: trade-action-repropose-sent
    direction: DOWN
    speed: 70
    visibilityPercentage: 100
    centerElement: true
    timeout: 30000
- tapOn:
    id: trade-action-repropose-sent
- assertVisible: Re-propose this trade?
- tapOn: Re-propose
- extendedWaitUntil:
    visible: Trade updated from the server response.
    timeout: 10000
- assertNotVisible: Shiny Dialga
- scrollUntilVisible:
    element:
      id: trade-action-delete-closed-delete
    direction: DOWN
    speed: 70
    visibilityPercentage: 100
    centerElement: true
    timeout: 30000
- tapOn:
    id: trade-action-delete-closed-delete
- assertVisible: Remove this trade from history?
- tapOn: Remove trade
- extendedWaitUntil:
    visible: Trade updated from the server response.
    timeout: 10000
- assertNotVisible: Shiny Lucario
- takeScreenshot: 05-complete-authoritative-lifecycle

appId: ${APP_ID}
name: Native authoritative trade-activity smoke
tags:
  - android
  - native-trades
---
- openLink:
    link: ${APP_LINK_BASE}/device-smoke/trade-activity
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "^Continue$"
    commands:
      - tapOn:
          text: "^Continue$"
          optional: true
- runFlow:
    when:
      visible: React Native dev menu
    commands:
      - tapOn: Close
- extendedWaitUntil:
    visible: Your trades
    timeout: 45000
- assertVisible: Offers
- assertVisible: Sent
- assertVisible: Active
- assertVisible: Done
- assertVisible: Closed
- assertVisible: Needs your response
- assertVisible: YOU OFFER
- assertVisible: OTHERTRAINER OFFERS
- assertVisible: Gigantamax Charizard
- assertVisible: Shiny Mewtwo
- takeScreenshot: 01-incoming-remote-offer
- tapOn:
    id: trade-filter-Proposed
- assertVisible: Waiting for trainer
- assertVisible: Shiny Dialga
- assertVisible: Shiny Remoraid
- takeScreenshot: 02-sent-lucky-trade
- scrollUntilVisible:
    element:
      id: trade-action-cancel-sent
    direction: DOWN
    speed: 70
    visibilityPercentage: 50
    timeout: 30000
- tapOn:
    id: trade-action-cancel-sent
- assertVisible: Cancel this trade?
- tapOn: Cancel trade
- extendedWaitUntil:
    visible: Trade updated from the server response.
    timeout: 10000
- assertVisible: No trades here
- takeScreenshot: 03-server-confirmed-cancel
- tapOn:
    id: trade-filter-Pending
- assertVisible: Ready to confirm
- swipe:
    start: 50%, 82%
    end: 50%, 50%
    duration: 450
- swipe:
    start: 50%, 82%
    end: 50%, 42%
    duration: 500
- extendedWaitUntil:
    visible: "^Coordinate trade$"
    timeout: 10000
- tapOn:
    text: "^Coordinate trade$"
    point: "50%,25%"
- extendedWaitUntil:
    visible: COORDINATE EXTERNALLY
    timeout: 10000
- assertVisible: "Pokémon GO name: OtherPogoName"
- assertVisible: "Trainer code: 1234 5678 9012"
- assertVisible: Pokémon Go Nexus does not include chat.*
- takeScreenshot: 04-external-coordination
- tapOn: Done
- tapOn:
    id: trade-filter-Accepting
- extendedWaitUntil:
    visible: Shiny Mewtwo
    timeout: 10000
- swipe:
    start: 50%, 55%
    end: 50%, 30%
    duration: 500
- extendedWaitUntil:
    visible: "^Accept offer$"
    timeout: 10000
- tapOn:
    text: "^Accept offer$"
    point: "50%,25%"
- assertVisible: Accept this offer?
- tapOn: Accept offer
- extendedWaitUntil:
    visible: Trade updated from the server response.
    timeout: 10000
- assertNotVisible: Shiny Mewtwo
- swipe:
    start: 50%, 82%
    end: 50%, 52%
    duration: 450
- swipe:
    start: 50%, 82%
    end: 50%, 42%
    duration: 500
- extendedWaitUntil:
    visible:
      id: trade-action-deny-incoming-deny
    timeout: 10000
- tapOn:
    id: trade-action-deny-incoming-deny
- assertVisible: Deny this offer?
- tapOn: Deny offer
- extendedWaitUntil:
    visible: No trades here
    timeout: 10000
- tapOn:
    id: trade-filter-Pending
- extendedWaitUntil:
    visible: Shiny Mewtwo
    timeout: 10000
- swipe:
    start: 50%, 55%
    end: 50%, 30%
    duration: 500
- swipe:
    start: 50%, 55%
    end: 50%, 30%
    duration: 500
- swipe:
    start: 50%, 55%
    end: 50%, 30%
    duration: 500
- swipe:
    start: 50%, 55%
    end: 50%, 30%
    duration: 500
- swipe:
    start: 50%, 55%
    end: 50%, 30%
    duration: 500
- swipe:
    start: 50%, 55%
    end: 50%, 30%
    duration: 500
- swipe:
    start: 50%, 55%
    end: 50%, 30%
    duration: 500
- extendedWaitUntil:
    visible: "^Confirm complete$"
    timeout: 10000
- tapOn:
    text: "^Confirm complete$"
    point: "50%,25%"
- assertVisible: Confirm the exchange happened?
- tapOn: Confirm complete
- extendedWaitUntil:
    visible: Trade updated from the server response.
    timeout: 10000
- assertNotVisible: Shiny Rayquaza
- tapOn:
    id: trade-filter-Completed
- extendedWaitUntil:
    visible: Shiny Ho-Oh
    timeout: 10000
- swipe:
    start: 50%, 55%
    end: 50%, 30%
    duration: 500
- extendedWaitUntil:
    visible: "^Mark as satisfying$"
    timeout: 10000
- tapOn:
    text: "^Mark as satisfying$"
    point: "50%,25%"
- assertVisible: Mark this trade as satisfying?
- tapOn: Save feedback
- extendedWaitUntil:
    visible: Trade updated from the server response.
    timeout: 10000
- assertNotVisible:
    id: trade-action-satisfy-completed
- swipe:
    start: 50%, 55%
    end: 50%, 28%
    duration: 500
- swipe:
    start: 50%, 55%
    end: 50%, 25%
    duration: 550
- swipe:
    start: 50%, 55%
    end: 50%, 25%
    duration: 550
- swipe:
    start: 50%, 55%
    end: 50%, 25%
    duration: 550
- extendedWaitUntil:
    visible:
      id: trade-action-delete-completed-delete
    timeout: 10000
- tapOn:
    id: trade-action-delete-completed-delete
- assertVisible: Remove this trade from history?
- tapOn: Remove trade
- extendedWaitUntil:
    visible: Trade updated from the server response.
    timeout: 10000
- assertNotVisible: Shiny Lugia
- tapOn:
    id: trade-filter-Cancelled
- extendedWaitUntil:
    visible: Shiny Dialga
    timeout: 10000
- swipe:
    start: 50%, 55%
    end: 50%, 30%
    duration: 500
- extendedWaitUntil:
    visible:
      id: trade-action-repropose-sent
    timeout: 10000
- tapOn:
    id: trade-action-repropose-sent
- assertVisible: Re-propose this trade?
- tapOn: Re-propose
- extendedWaitUntil:
    visible: Trade updated from the server response.
    timeout: 10000
- assertNotVisible: Shiny Dialga
- swipe:
    start: 50%, 55%
    end: 50%, 28%
    duration: 500
- swipe:
    start: 50%, 55%
    end: 50%, 25%
    duration: 550
- swipe:
    start: 50%, 55%
    end: 50%, 25%
    duration: 550
- swipe:
    start: 50%, 55%
    end: 50%, 25%
    duration: 550
- extendedWaitUntil:
    visible:
      id: trade-action-delete-closed-delete
    timeout: 10000
- tapOn:
    id: trade-action-delete-closed-delete
- assertVisible: Remove this trade from history?
- tapOn: Remove trade
- extendedWaitUntil:
    visible: Trade updated from the server response.
    timeout: 10000
- assertNotVisible: Shiny Lucario
- takeScreenshot: 05-complete-authoritative-lifecycle

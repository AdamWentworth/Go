appId: host.exp.exponent
name: Native authoritative trade-activity smoke
tags:
  - android
  - native-trades
---
- openLink:
    link: exp://10.0.2.2:8091/--/device-smoke/trade-activity
- runFlow:
    when:
      visible: "This is the developer menu.*"
    commands:
      - tapOn: Continue
- runFlow:
    when:
      visible: React Native dev menu
    commands:
      - tapOn: Close
- extendedWaitUntil:
    visible: Your trades
    timeout: 45000
- assertVisible: Offers
- assertVisible: Sent
- assertVisible: Active
- assertVisible: Done
- assertVisible: Closed
- assertVisible: Needs your response
- assertVisible: YOU OFFER
- assertVisible: OTHERTRAINER OFFERS
- assertVisible: Gigantamax Charizard
- assertVisible: Shiny Mewtwo
- takeScreenshot: 01-incoming-remote-offer
- tapOn:
    id: trade-filter-Proposed
- assertVisible: Waiting for trainer
- assertVisible: Shiny Dialga
- assertVisible: Shiny Remoraid
- takeScreenshot: 02-sent-lucky-trade
- tapOn:
    id: trade-action-cancel-sent
- assertVisible: Cancel this trade?
- tapOn: Cancel trade
- extendedWaitUntil:
    visible: Trade updated from the server response.
    timeout: 10000
- assertVisible: No trades here
- takeScreenshot: 03-server-confirmed-cancel
- tapOn:
    id: trade-filter-Pending
- assertVisible: Ready to confirm
- tapOn:
    id: trade-action-coordinate-active
- extendedWaitUntil:
    visible: COORDINATE EXTERNALLY
    timeout: 10000
- assertVisible: "Pokémon GO name: OtherPogoName"
- assertVisible: "Trainer code: 1234 5678 9012"
- assertVisible: Pokémon Go Nexus does not include chat.*
- takeScreenshot: 04-external-coordination
- tapOn: Done
- tapOn:
    id: trade-filter-Accepting
- tapOn:
    id: trade-action-accept-incoming
- assertVisible: Accept this offer?
- tapOn: Accept offer
- extendedWaitUntil:
    visible: Trade updated from the server response.
    timeout: 10000
- assertNotVisible: Shiny Mewtwo
- tapOn:
    id: trade-action-deny-incoming-deny
- assertVisible: Deny this offer?
- tapOn: Deny offer
- extendedWaitUntil:
    visible: No trades here
    timeout: 10000
- tapOn:
    id: trade-filter-Pending
- scrollUntilVisible:
    element:
      id: trade-action-complete-active-completable
    direction: DOWN
- tapOn:
    id: trade-action-complete-active-completable
- assertVisible: Confirm the exchange happened?
- tapOn: Confirm complete
- extendedWaitUntil:
    visible: Trade updated from the server response.
    timeout: 10000
- assertNotVisible: Shiny Rayquaza
- tapOn:
    id: trade-filter-Completed
- tapOn:
    id: trade-action-satisfy-completed
- assertVisible: Mark this trade as satisfying?
- tapOn: Save feedback
- extendedWaitUntil:
    visible: Trade updated from the server response.
    timeout: 10000
- assertNotVisible:
    id: trade-action-satisfy-completed
- scrollUntilVisible:
    element:
      id: trade-action-delete-completed-delete
    direction: DOWN
- tapOn:
    id: trade-action-delete-completed-delete
- assertVisible: Remove this trade from history?
- tapOn: Remove trade
- extendedWaitUntil:
    visible: Trade updated from the server response.
    timeout: 10000
- assertNotVisible: Shiny Lugia
- tapOn:
    id: trade-filter-Cancelled
- tapOn:
    id: trade-action-repropose-sent
- assertVisible: Re-propose this trade?
- tapOn: Re-propose
- extendedWaitUntil:
    visible: Trade updated from the server response.
    timeout: 10000
- assertNotVisible: Shiny Dialga
- scrollUntilVisible:
    element:
      id: trade-action-delete-closed-delete
    direction: DOWN
- tapOn:
    id: trade-action-delete-closed-delete
- assertVisible: Remove this trade from history?
- tapOn: Remove trade
- extendedWaitUntil:
    visible: Trade updated from the server response.
    timeout: 10000
- assertNotVisible: Shiny Lucario
- takeScreenshot: 05-complete-authoritative-lifecycle

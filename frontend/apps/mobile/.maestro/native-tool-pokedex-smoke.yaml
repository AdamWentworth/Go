appId: host.exp.exponent
name: Native Pokédex tool smoke
---
- openLink: "exp://10.0.2.2:8091/--/device-smoke/tools?tool=pokedex"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "^Continue$"
    commands:
      - tapOn: "^Continue$"
- runFlow:
    when:
      visible: React Native dev menu
    commands:
      - tapOn: Close
- assertVisible: "Pokédex"
- assertVisible: "Kanto"
- assertVisible: "Advanced"
- takeScreenshot: "native-tool-pokedex-regions"
- tapOn: "Shiny"
- tapOn: "Kanto"
- tapOn: "Search Pokédex"
- inputText: "bulba"
- hideKeyboard
- extendedWaitUntil:
    visible: "Shiny Bulbasaur"
    timeout: 15000
- takeScreenshot: "native-tool-pokedex-region-detail"

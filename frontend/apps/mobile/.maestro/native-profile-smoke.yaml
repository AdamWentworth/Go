appId: ${APP_ID}
name: Native trainer profile parity smoke
tags:
  - android
  - native-profile
---
- openLink:
    link: ${APP_LINK_BASE}/device-smoke/profile
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "^Continue$"
    commands:
      - tapOn:
          text: "^Continue$"
          optional: true
- runFlow:
    when:
      visible: React Native dev menu
    commands:
      - tapOn: Close
- extendedWaitUntil:
    visible: YOUR TRAINER CARD
    timeout: 45000
- assertVisible: NexusDemo
- assertVisible: "@NexusDemo"
- assertVisible: League Ace
- assertVisible: Mewtwo
- takeScreenshot: native-trainer-profile-initial
- tapOn: Edit
- scrollUntilVisible:
    element:
      text: Your trainer details
    direction: DOWN
    timeout: 10000
- scrollUntilVisible:
    element:
      text: POKÉMON GO NAME
    direction: DOWN
    timeout: 10000
- assertVisible: POKÉMON GO NAME
- tapOn: Pokémon GO name
- eraseText: 20
- inputText: NexusGoUpdated
- hideKeyboard
- takeScreenshot: native-trainer-profile-editor
- scrollUntilVisible:
    element:
      id: native-profile-showcase-slot-1
    direction: DOWN
    speed: 70
    visibilityPercentage: 50
    timeout: 30000
- tapOn:
    id: native-profile-showcase-slot-1
- assertVisible: Choose a caught Pokémon
- assertVisible: Shiny Metagross
- takeScreenshot: native-trainer-showcase-picker
- tapOn: Shiny Metagross
- scrollUntilVisible:
    element:
      text: Save profile
    direction: UP
    timeout: 10000
- tapOn: Save profile
- assertVisible: Profile updated.
- scrollUntilVisible:
    element:
      text: NexusGoUpdated
    direction: UP
    timeout: 10000
- assertVisible: NexusGoUpdated
- scrollUntilVisible:
    element:
      text: Lucky Trader
    direction: DOWN
    timeout: 10000
- assertVisible: Lucky Trader
- assertVisible: Kanto Collector
- scrollUntilVisible:
    element:
      text: View Pokémon
    direction: DOWN
    timeout: 10000
- assertVisible: View Pokémon
- takeScreenshot: native-trainer-profile

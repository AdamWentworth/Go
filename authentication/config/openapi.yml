openapi: 3.1.0
info:
  title: Authentication API
  version: 1.0.0
  description: API to handle authentication including local and social logins.

servers:
  - url: http://localhost:3003/
    description: Local development server

paths:
  /auth/login:
    post:
      summary: Authenticate a user with username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Authentication failed

  /auth/register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '409':
          description: Username or email already exists

  /auth/refresh:
    post:
      summary: Refresh the authentication tokens
      description: Refreshes access and refresh tokens for a user based on the session token provided in cookies.
      responses:
        '200':
          description: Tokens refreshed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Tokens refreshed successfully."
        '401':
          description: Unauthorized request, session token required or token is invalid
        '404':
          description: No session found with the provided token
        '500':
          description: Internal Server Error
  
  /auth/logout:
    post:
      summary: Log out a user
      description: Invalidates the user's session or token to securely log out.
      responses:
        '200':
          description: Successfully logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Successfully logged out."
        '401':
          description: Unauthorized to log out (e.g., not logged in)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /auth/google:
    get:
      summary: Redirect to Google for authentication
      description: Redirects the user to Google for OAuth authentication. No request body required.
      responses:
        '302':
          description: Redirect to Google's OAuth 2.0 login page.
        '503':
          description: Google OAuth has not been configured.

  /auth/google/callback:
    get:
      summary: Verify Google's response and continue login or registration
      responses:
        '302':
          description: Redirect to the allow-listed frontend login or registration flow.

  /auth/google/pending:
    get:
      summary: Read the verified email for a pending Google registration
      responses:
        '200':
          description: Pending Google identity
        '401':
          description: Pending registration expired or invalid

  /auth/google/complete-registration:
    post:
      summary: Create an account from a verified pending Google identity
      responses:
        '201':
          description: Google account created and session cookies issued
        '409':
          description: Username, email, trainer name, or trainer code already exists

components:
  securitySchemes:
    bearerAuth:    # Assuming JWT Bearer Token is used
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginResponse:
      type: object
      properties:
        user_id:
          type: string
        username:
          type: string
        token:
          type: string
        message:
          type: string

    RegisterResponse:
      type: object
      properties:
        user:
          type: object
          properties:
            username:
              type: string
            email:
              type: string
        token:
          type: string
        message:
          type: string

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
